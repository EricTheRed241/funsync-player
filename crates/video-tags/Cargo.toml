[package]
name = "video-tags"
version = "0.1.0"
description = "Maintain <userData>/video-tags.json, the per-video tags FunSync merges into the library on every scan"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "video_tags"
path = "src/lib.rs"

[[bin]]
name = "video-tags"
path = "src/main.rs"

[dependencies]
# The access PIN's login tokens (crate::access): HMAC-SHA256.
hmac = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
unicode-normalization = "0.1"
