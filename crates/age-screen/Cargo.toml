[package]
name = "age-screen"
version = "0.1.0"
description = "Weekly underage screener: contact sheets judged by a vision model; purge (1★), review playlist or clear"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "age_screen"
path = "src/lib.rs"

[[bin]]
name = "age-screen"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
