<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FunSync · Associate scripts</title>
<script src="/site-nav.js" defer></script>
<style>
  :root { color-scheme: dark; font: 14px/1.4 system-ui, sans-serif; }
  body { margin: 0; background: #111216; color: #ddd; }
  main { padding: 12px 16px; display: grid; grid-template-columns: minmax(240px, 360px) 1fr; gap: 16px; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } }
  input, select, button { background: #1b1c22; color: #ddd; border: 1px solid #3a3b42; border-radius: 4px; padding: 5px 7px; font: inherit; }
  button { cursor: pointer; background: #2a2b33; }
  ul { list-style: none; padding: 0; margin: 8px 0; max-height: 75vh; overflow: auto; }
  li { padding: 4px 6px; border-radius: 4px; cursor: pointer; } li.on { background: #2b3550; }
  .muted { color: #888; font-size: 12px; } .none { color: #d93; }
  table { border-collapse: collapse; width: 100%; } td { border-top: 1px solid #2a2b31; padding: 4px 6px; }
  select { max-width: 100%; }
</style>
</head>
<body>
<main>
  <section>
    <input id="q" type="search" placeholder="Search videos" style="width:100%">
    <label><input type="checkbox" id="missing" checked> only videos without a script</label>
    <ul id="videos"></ul>
  </section>
  <section id="detail"><p class="muted">Pick a video.</p></section>
</main>
<script type="module">
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const base = (p) => String(p || '').split('/').pop();
let videos = [];
let current = null;
async function loadVideos() {
  videos = (await (await fetch('/api/remote/videos')).json()).videos;
  renderList();
}
function renderList() {
  const q = $('q').value.trim().toLowerCase();
  const list = videos.filter((v) => (!$('missing').checked || !v.hasFunscript) && (!q || v.path.toLowerCase().includes(q)));
  $('videos').innerHTML = list.slice(0, 400).map((v) => `<li data-id="${v.id}" class="${v.id === current ? 'on' : ''}">${esc(v.name)}${v.hasFunscript ? '' : ' <span class="none">no script</span>'}</li>`).join('');
}
async function show(id) {
  current = id;
  renderList();
  const d = await (await fetch(`/api/associate/${id}`)).json();
  const opts = (sel) => `<option value="">—</option>` + d.suggestions.map((s) =>
    `<option value="${esc(s.path)}" ${s.path === sel ? 'selected' : ''}>${esc(base(s.path))}${s.sameFolder ? ' (same folder)' : ` · ${s.score}%`}</option>`).join('');
  const axes = Object.fromEntries((d.current.axes || []).map((a) => [a.axis, a.path]));
  $('detail').innerHTML = `<h3>${esc(d.video.name)}</h3><p class="muted">${esc(d.video.path)}</p>
    <p>Now: ${d.current.funscriptPath ? esc(base(d.current.funscriptPath)) : '<span class="none">no script</span>'}
      ${d.entry?.active ? `<span class="muted">(manual: ${esc(d.entry.active)})</span>` : '<span class="muted">(auto-paired)</span>'}</p>
    <table><tr><td>Main script</td><td><select id="main">${opts(d.current.funscriptPath)}</select></td></tr>
    ${d.axisNames.map((a) => `<tr><td>${a}</td><td><select data-axis="${a}">${opts(axes[a])}</select></td></tr>`).join('')}</table>
    <p><button id="save">Save association</button> <button id="clear">Back to automatic pairing</button></p>`;
  $('save').onclick = async () => {
    const axesSel = Object.fromEntries([...document.querySelectorAll('[data-axis]')].filter((s) => s.value).map((s) => [s.dataset.axis, s.value]));
    const main = $('main').value || null;
    const body = Object.keys(axesSel).length ? { active: 'multi', main, axes: axesSel } : { active: 'single', single: main };
    await post(id, body);
  };
  $('clear').onclick = () => post(id, { active: null });
}
async function post(id, body) {
  const r = await fetch(`/api/associate/${id}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (!r.ok) { alert((await r.json()).error); return; }
  setTimeout(async () => { await loadVideos(); show(id); }, 1500);
}
$('videos').onclick = (e) => { const li = e.target.closest('li'); if (li) show(li.dataset.id); };
$('q').oninput = renderList;
$('missing').onchange = renderList;
loadVideos();
</script>
</body>
</html>
