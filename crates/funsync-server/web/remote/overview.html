<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FunSync · Overview</title>
<script src="/site-nav.js" defer></script>
<style>
  :root { color-scheme: dark; font: 14px/1.4 system-ui, sans-serif; }
  body { margin: 0; background: #111216; color: #ddd; }
  main { padding: 12px 16px; max-width: 1000px; }
  h1 { font-size: 18px; } h2 { font-size: 15px; margin-top: 24px; }
  .tiles { display: flex; gap: 10px; flex-wrap: wrap; }
  .tile { background: #1b1c22; border-radius: 6px; padding: 8px 12px; min-width: 110px; color: inherit; text-decoration: none; }
  .tile b { display: block; font-size: 20px; }
  .bar { height: 10px; border-radius: 5px; background: #333; overflow: hidden; margin: 8px 0; }
  .bar div { height: 100%; background: #3a3; } .bar.warn div { background: #d93; } .bar.full div { background: #c44; }
  table { border-collapse: collapse; width: 100%; } td { border-top: 1px solid #2a2b31; padding: 4px 6px; }
  .hist { display: flex; align-items: flex-end; gap: 6px; height: 90px; }
  .hist div { flex: 1; background: #e94560; min-height: 1px; text-align: center; font-size: 11px; }
  .stars button { background: none; border: 0; color: #777; cursor: pointer; font-size: 16px; padding: 0 1px; }
  .stars button.on { color: #fc3; } .heart { color: #e94560; }
</style>
</head>
<body>
<main>
  <h1>Overview</h1>
  <h2>Library capacity</h2>
  <div class="tiles" id="capacity"></div>
  <div class="bar" id="capbar"><div></div></div>
  <table id="sources"></table>
  <h2>Ratings and favourites</h2>
  <div class="tiles" id="ratings"></div>
  <div class="hist" id="hist"></div>
  <table id="rated"></table>
  <h2>Artists and tags</h2>
  <div class="tiles"><a class="tile" href="/remote/#artists">Favourite artists<b>→</b></a><a class="tile" href="/remote/#tags">Tag scores<b>→</b></a></div>
</main>
<script type="module">
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const gb = (b) => `${(b / 1e9).toFixed(1)} GB`;
const tile = (label, value, href) => `<${href ? `a href="${href}"` : 'div'} class="tile">${esc(label)}<b>${esc(value)}</b></${href ? 'a' : 'div'}>`;

async function load() {
  const [settings, raw, remote] = await Promise.all(['/api/settings', '/api/videos', '/api/remote/videos'].map((u) => fetch(u).then((r) => r.json())));
  const size = new Map(raw.map((v) => [v.id, v.size || 0]));
  const max = settings.libraryMaxVideos || 1000;
  const total = raw.length;
  const share = total / max;
  $('capacity').innerHTML = tile('Videos', `${total} / ${max}`) + tile('Full', `${Math.round(share * 100)} %`) + tile('On disk', gb(raw.reduce((n, v) => n + (v.size || 0), 0)));
  $('capbar').className = `bar${share >= 1 ? ' full' : share >= 0.9 ? ' warn' : ''}`;
  $('capbar').firstElementChild.style.width = `${Math.min(100, share * 100)}%`;
  $('sources').innerHTML = settings.sources.map((s) => {
    const vids = raw.filter((v) => v.path.startsWith(s.path));
    return `<tr><td>${esc(s.name)}</td><td>${vids.length} videos</td><td>${gb(vids.reduce((n, v) => n + (v.size || 0), 0))}</td></tr>`;
  }).join('');

  const vids = remote.videos;
  const keepMin = settings.ratings?.topRatedMin ?? 4;
  const fav = vids.filter((v) => v.favorite).length;
  $('ratings').innerHTML = tile('Favourites', fav) + tile('Keep (' + keepMin + '★+)', vids.filter((v) => v.rating >= keepMin).length) + tile('Unrated', vids.filter((v) => !v.rating).length);
  const counts = [1, 2, 3, 4, 5].map((s) => vids.filter((v) => Math.ceil(v.rating) === s).length);
  const top = Math.max(1, ...counts);
  $('hist').innerHTML = counts.map((c, i) => `<div style="height:${(100 * c) / top}%" title="${c}">${i + 1}★ ${c}</div>`).join('');
  const rated = vids.filter((v) => v.rating || v.favorite).sort((a, b) => b.rating - a.rating || a.name.localeCompare(b.name));
  $('rated').innerHTML = rated.map((v) => `<tr><td><a href="/remote/#play/${v.id}">${esc(v.name)}</a></td>
    <td class="stars" data-id="${v.id}">${[1, 2, 3, 4, 5].map((s) => `<button data-r="${s}" class="${v.rating >= s ? 'on' : ''}">★</button>`).join('')}</td>
    <td class="heart">${v.favorite ? '♥' : ''}</td><td>${gb(size.get(v.id) || 0)}</td></tr>`).join('');
}
$('rated').onclick = async (e) => {
  const r = e.target.dataset.r;
  if (!r) return;
  await fetch('/api/remote/rating', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ videoId: e.target.parentElement.dataset.id, rating: Number(r) }) });
  load();
};
load();
</script>
</body>
</html>
