<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FunSync · EroScripts</title>
<script src="/site-nav.js" defer></script>
<style>
  :root { color-scheme: dark; font: 14px/1.4 system-ui, sans-serif; }
  body { margin: 0; background: #111216; color: #ddd; }
  main { padding: 12px 16px; max-width: 1000px; }
  h1 { font-size: 18px; } h2 { font-size: 15px; margin-top: 20px; }
  input, select { background: #1b1c22; color: #ddd; border: 1px solid #3a3b42; border-radius: 4px; padding: 5px 7px; }
  button { background: #2a2b33; color: #ddd; border: 1px solid #44454d; border-radius: 4px; padding: 4px 9px; cursor: pointer; }
  form { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
  .muted { color: #888; font-size: 12px; } .err { color: #e77; } .paid { background: #a63; color: #fff; border-radius: 3px; padding: 0 5px; font-size: 11px; }
  .results { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
  .card { background: #1b1c22; border-radius: 6px; overflow: hidden; cursor: pointer; }
  .card img { width: 100%; aspect-ratio: 16/9; object-fit: cover; background: #000; display: block; }
  .card div { padding: 6px; }
  table { border-collapse: collapse; width: 100%; } td { border-top: 1px solid #2a2b31; padding: 5px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>EroScripts</h1>
  <section id="out" hidden>
    <form id="login">
      <input name="username" placeholder="Username or email" autocomplete="username">
      <input name="password" type="password" placeholder="Password" autocomplete="current-password">
      <input name="code" placeholder="2FA code" hidden autocomplete="one-time-code">
      <button>Log in</button>
    </form>
    <form id="cookie"><input name="cookie" placeholder="…or paste the _t cookie" size="40"><button>Use cookie</button></form>
  </section>
  <section id="in" hidden>
    <p class="muted">Logged in as <b id="user"></b> <button id="logout">Log out</button></p>
    <form id="search">
      <input name="q" placeholder="Search scripts" size="40">
      <select id="video"><option value="">Save to video…</option></select>
      <button>Search</button>
    </form>
    <p class="muted">Videos without a script: <select id="unscripted"><option value="">Find scripts for…</option></select></p>
    <p id="found" class="muted"></p>
    <p id="owns" class="muted"></p>
    <p class="muted"><button id="previews">Fetch EroScripts previews</button> <span id="previewsMsg">Re-checks the thumbnails FunSync set from posts and FapTap, then gives every video with a known post and no thumbnail the post picture that shows it.</span></p>
    <div id="results" class="results"></div>
    <div id="topic"></div>
  </section>
  <p id="msg" class="muted"></p>
</main>
<script type="module">
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const msg = (t, err) => { $('msg').textContent = t || ''; $('msg').className = err ? 'err' : 'muted'; };
async function call(url, body) {
  const r = await fetch(url, body === undefined ? {} : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const v = await r.json().catch(() => ({}));
  if (r.status === 401) refresh();
  return { status: r.status, ...v };
}
let videos = [];
async function refresh() {
  const s = await call('/api/eroscripts/session');
  const live = s.loggedIn && !s.expired;
  $('out').hidden = live; $('in').hidden = !live; $('user').textContent = s.username || '';
  if (s.expired) msg(`The EroScripts session of ${s.username} has expired — log in again`, true);
  $('owns').textContent = s.ownsLibrary ? '' : 'Scripts can be found here; saving them waits until FunSync in Rust owns the library.';
  if (!live || videos.length) return;
  videos = (await call('/api/remote/videos')).videos || [];
  $('video').insertAdjacentHTML('beforeend', videos.map((v) => `<option value="${esc(v.id)}">${esc(v.name)}</option>`).join(''));
  matches();
}
// Auto-match: the server searches EroScripts for every video without a
// script in the background; the ones with posts come first in the list.
async function matches() {
  const m = await call('/api/eroscripts/matches');
  const hits = m.matches || {};
  const list = videos.filter((v) => !v.hasFunscript)
    .sort((a, b) => (hits[b.id]?.count || 0) - (hits[a.id]?.count || 0));
  const keep = $('unscripted').value;
  $('unscripted').innerHTML = '<option value="">Find scripts for…</option>' + list.map((v) =>
    `<option value="${esc(v.id)}">${hits[v.id] ? `● ${esc(v.name)} — ${hits[v.id].count} found` : esc(v.name)}</option>`).join('');
  $('unscripted').value = keep;
  const n = Object.keys(hits).length;
  $('found').textContent = `Scripts found on EroScripts for ${n} of ${m.scriptless} videos without a script` +
    (m.running ? ` (checking: ${m.checked} of ${m.scriptless} looked up)` : '');
  if (m.running) setTimeout(matches, 15000);
}
$('login').onsubmit = async (e) => {
  e.preventDefault();
  const r = await call('/api/eroscripts/login', Object.fromEntries(new FormData(e.target)));
  if (r.needsCode) { e.target.code.hidden = false; e.target.code.focus(); return msg('Enter the code from your authenticator app'); }
  r.ok ? (msg(''), refresh()) : msg(r.error, true);
};
$('cookie').onsubmit = async (e) => {
  e.preventDefault();
  const r = await call('/api/eroscripts/login', Object.fromEntries(new FormData(e.target)));
  r.ok ? (msg(''), refresh()) : msg(r.error, true);
};
$('logout').onclick = async () => { await call('/api/eroscripts/logout', {}); refresh(); };
async function search(q) {
  msg('Searching…'); $('topic').innerHTML = '';
  const r = await call(`/api/eroscripts/search?q=${encodeURIComponent(q)}`);
  if (r.error) return msg(r.error, true);
  msg(r.results.length ? '' : 'No scripts found');
  $('results').innerHTML = r.results.map((t, i) => `<div class="card" data-i="${i}">
    <img src="${esc(t.thumbnail || '')}" alt="" loading="lazy" referrerpolicy="no-referrer">
    <div>${t.paid ? '<span class="paid">Paid</span> ' : ''}${esc(t.title)}<br><span class="muted">${esc(t.creator)} · ♥ ${t.likeCount}</span></div></div>`).join('');
  $('results').onclick = (e) => { const c = e.target.closest('.card'); if (c) openTopic(r.results[c.dataset.i]); };
}
$('search').onsubmit = (e) => { e.preventDefault(); search(e.target.q.value); };
$('unscripted').onchange = (e) => {
  const v = videos.find((x) => x.id === e.target.value);
  if (!v) return;
  $('video').value = v.id; $('search').q.value = v.name; search(v.name);
};
$('previews').onclick = async () => {
  const r = await call('/api/eroscripts/previews', {});
  if (r.error) return msg(r.error, true);
  previewStatus();
};
async function previewStatus() {
  const s = await call('/api/eroscripts/previews');
  $('previews').disabled = !!s.running;
  if (s.running) {
    $('previewsMsg').textContent = `${s.phase === 'revalidate' ? 'Checking set thumbnails' : 'Fetching previews'}: ${s.done} of ${s.total}`;
    return setTimeout(previewStatus, 2000);
  }
  const m = s.summary;
  if (m) $('previewsMsg').textContent = `Set ${m.imported}, removed ${m.revalidated.removed} that didn't show their video, `
    + `no match ${m.noMatch}, no picture ${m.noImage}, failed ${m.failed} (${m.known} videos with a known post).`;
}
previewStatus();
let topicId = null;
async function openTopic(t) {
  topicId = t.id;
  msg('Loading post…');
  const d = await call(`/api/eroscripts/topic/${t.id}`);
  if (d.error) return msg(d.error, true);
  msg('');
  const row = (a, i) => `<tr><td>${esc(a.name)}</td><td class="muted">${esc(a.username)}${a.byAuthor ? ' (author)' : ''} · #${a.postNumber}</td>
    <td><button data-i="${i}">${/\.zip$/i.test(a.name) ? 'Save (unzip)' : 'Save'}</button></td></tr>`;
  $('topic').innerHTML = `<h2>${d.paid ? '<span class="paid">Paid</span> ' : ''}<a href="${esc(t.url)}" target="_blank">${esc(t.title)}</a></h2>
    ${d.preview ? `<button id="poster">Use the post picture as the video's thumbnail</button>` : ''}
    <table>${d.attachments.map(row).join('') || '<tr><td class="muted">No script files on the forum</td></tr>'}</table>
    ${d.linked.length ? `<h2>On pixeldrain</h2><table>${d.linked.map((a) => `<tr><td><a href="${esc(a.url)}" target="_blank">${esc(a.name)}</a></td><td class="muted">${esc(a.username)}</td></tr>`).join('')}</table>` : ''}
    ${d.external.length ? `<p class="muted">Also hosted on: ${[...new Set(d.external.map((e) => e.host))].map(esc).join(', ')}</p>` : ''}`;
  $('topic').querySelectorAll('button[data-i]').forEach((b) => (b.onclick = () => save(d.attachments[b.dataset.i])));
  if ($('poster')) $('poster').onclick = async () => {
    if (!$('video').value) return msg('Pick the video first', true);
    const r = await call('/api/eroscripts/preview', { videoId: $('video').value, url: d.preview, topicId: t.id });
    r.ok ? msg('Thumbnail saved') : msg(r.error, true);
  };
  $('topic').scrollIntoView({ behavior: 'smooth' });
}
async function save(a, extra = {}) {
  const videoId = $('video').value;
  if (!videoId) return msg('Pick the video to save the script for', true);
  const r = await call('/api/eroscripts/download', { videoId, url: a.url, name: a.name, topicId, ...extra });
  if (r.exists) {
    const label = prompt(`${r.error}.\nType a variant name to keep both (empty: replace the existing script):`, a.username);
    if (label === null) return;
    return save(a, label.trim() ? { variant: label.trim() } : { replace: true });
  }
  r.ok ? msg(`Saved ${(r.paths || [r.path]).join(', ')}`) : msg(r.error, true);
  if (r.ok) videos = [];
}
refresh();
</script>
</body>
</html>
