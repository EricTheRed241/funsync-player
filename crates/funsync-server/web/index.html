<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FunSync (Rust)</title>
<style>
  :root { color-scheme: dark; font-family: system-ui, sans-serif; }
  body { margin: 0; background: #111; color: #ddd; }
  header { padding: 10px 14px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; border-bottom: 1px solid #333; }
  header h1 { font-size: 16px; margin: 0; }
  #status { font-size: 13px; color: #999; }
  input { background: #222; color: #ddd; border: 1px solid #444; border-radius: 4px; padding: 5px 8px; }
  button { background: #333; color: #ddd; border: 1px solid #555; border-radius: 4px; padding: 5px 10px; cursor: pointer; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; padding: 12px; }
  .card { cursor: pointer; background: #1b1b1b; border-radius: 6px; overflow: hidden; }
  .card img { width: 100%; aspect-ratio: 16/9; object-fit: cover; background: #222; display: block; }
  .card div { font-size: 12px; padding: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge { color: #7c7; }
  #player { display: none; padding: 12px; }
  #player video { width: 100%; max-height: 70vh; background: #000; }
</style>
</head>
<body>
<header>
  <h1>FunSync (Rust) · phase 1</h1>
  <input id="q" type="search" placeholder="Search">
  <button id="rescan">Rescan</button>
  <span id="status"></span>
</header>
<section id="player"><button id="close">Close</button> <span id="title"></span><video id="video" controls></video></section>
<main id="grid"></main>
<script type="module">
const $ = (id) => document.getElementById(id);
let videos = [];
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
async function load() {
  const st = await (await fetch('/api/status')).json();
  $('status').textContent = `${st.videos} videos · ${st.withScript} with a script` +
    (st.scanning ? ' · scanning…' : '') + (st.failedPaths.length ? ` · unreadable: ${st.failedPaths.join(', ')}` : '');
  videos = await (await fetch('/api/videos')).json();
  render();
  if (st.scanning) setTimeout(load, 2000);
}
function render() {
  const q = $('q').value.trim().toLowerCase();
  const list = q ? videos.filter((v) => v.path.toLowerCase().includes(q)) : videos;
  $('grid').innerHTML = list.slice(0, 300).map((v) =>
    `<div class="card" data-id="${v.id}"><img loading="lazy" src="/api/media/thumb/${v.id}" alt="">` +
    `<div title="${esc(v.path)}">${v.funscriptPath ? '<span class="badge">●</span> ' : ''}${esc(v.name)}</div></div>`).join('');
}
$('grid').addEventListener('click', (e) => {
  const card = e.target.closest('.card');
  if (!card) return;
  const v = videos.find((x) => x.id === card.dataset.id);
  $('title').textContent = v.name;
  $('video').src = `/api/media/stream/${v.id}`;
  $('player').style.display = 'block';
  $('video').play().catch(() => {});
  window.scrollTo(0, 0);
});
$('close').onclick = () => { $('video').pause(); $('video').removeAttribute('src'); $('player').style.display = 'none'; };
$('q').oninput = render;
$('rescan').onclick = async () => { $('status').textContent = 'scanning…'; await fetch('/api/scan', { method: 'POST' }); load(); };
load();
</script>
</body>
</html>
