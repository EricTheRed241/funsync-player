[package]
name = "funsync-server"
version = "0.1.0"
description = "FunSync in Rust: one server that owns the library and serves the web UI (port 5300)"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "funsync_server"
path = "src/lib.rs"

[[bin]]
name = "funsync-server"
path = "src/main.rs"

# The one crate allowed an HTTP framework (AGENTS.md, "Rust app"): WebSockets,
# range streaming and many connections. tower-http's ServeFile does the
# Range / If-Modified-Since handling for video streams.
[dependencies]
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3.34"
md5 = "0.8"
regex = "1"
serde = { version = "1", features = ["derive"] }
# The access PIN gate (scout_report::gate) and its token format (video_tags::access),
# shared with the old backend so one login covers both apps.
scout-report = { path = "../scout-report" }
video-tags = { path = "../video-tags" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "process", "sync", "time", "signal", "io-util"] }
tokio-tungstenite = "0.29"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
unicode-normalization = "0.1"
zip = { version = "9.8.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
