<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17181b" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='1.5' width='24' height='29' rx='5' fill='%23e0529c'/%3E%3Cpath d='M16 25.5C8.5 20.4 6.5 16.6 6.5 13.4 6.5 10.6 8.7 8.5 11.3 8.5c2 0 3.6 1.1 4.7 2.8 1.1-1.7 2.7-2.8 4.7-2.8 2.6 0 4.8 2.1 4.8 4.9 0 3.2-2 7-9.5 12.1z' fill='%23fff'/%3E%3C/svg%3E">
<title>EroScripts scout swipe</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #fafafa; --fg: #1d1d1f; --muted: #6b6b70; --line: #d9d9de; --panel: #ffffff;
  --accent: #2f6fdf; --row: #f2f2f5; --warn-bg: #fff4d6; --warn-fg: #6b4e00;
  --like: #3aa655; --nope: #e05252; --undo: #d08b2c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #17181b; --fg: #e6e6e9; --muted: #9a9aa3; --line: #34353b; --panel: #1f2024;
    --accent: #7aa7ff; --row: #2a2b31; --warn-bg: #3d3214; --warn-fg: #ffd98a;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; display: flex; flex-direction: column; height: 100dvh; overflow: hidden; overscroll-behavior: none;
  background: var(--bg); color: var(--fg); font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.bar { position: relative; display: flex; align-items: baseline; gap: 12px;
  padding: calc(10px + env(safe-area-inset-top)) 16px 6px; width: min(100%, 560px); margin: 0 auto; }
.bar h1 { font-size: 18px; margin: 0; }
.counter { color: var(--muted); margin-right: auto; font-variant-numeric: tabular-nums; white-space: nowrap; }
.bar button { background: none; border: none; padding: 0 4px; color: var(--accent); font: inherit; font-size: 20px;
  line-height: 1; cursor: pointer; white-space: nowrap; touch-action: manipulation; }
.settings { position: absolute; top: 100%; right: 12px; z-index: 20; width: min(300px, calc(100vw - 24px));
  display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; font-size: 13px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 6px 24px rgba(0,0,0,.22); }
.settings label { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.settings input { width: 76px; font: inherit; padding: 3px 6px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--bg); color: var(--fg); text-align: right; }
.settings .note { color: var(--muted); font-size: 12px; }
.settings .reset { align-self: flex-end; background: none; border: 1px solid var(--line); border-radius: 6px;
  padding: 3px 10px; font: inherit; font-size: 12px; color: var(--accent); cursor: pointer; }
.stacks { display: flex; gap: 0; width: min(100% - 32px, 528px); margin: 0 auto 8px; border: 1px solid var(--line);
  border-radius: 8px; overflow: hidden; }
.stacks button { flex: 1; background: none; border: none; border-radius: 0; padding: 6px 4px; font: inherit; font-size: 13px;
  color: var(--muted); cursor: pointer; touch-action: manipulation; }
.stacks button + button { border-left: 1px solid var(--line); }
.stacks button.on { background: color-mix(in srgb, var(--accent) 20%, transparent); color: var(--fg); font-weight: 600; }
.problems { background: var(--warn-bg); color: var(--warn-fg); padding: 6px 12px; border-radius: 6px;
  margin: 0 auto 6px; width: min(100% - 20px, 540px); white-space: pre-wrap; font-size: 13px; }
.deck { position: relative; flex: 1; min-height: 0; width: min(100% - 20px, 540px); margin: 4px auto 0; }
.card { position: absolute; inset: 0; display: flex; flex-direction: column; overflow: hidden;
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 6px 24px rgba(0,0,0,.18);
  touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  transition: transform .3s ease, opacity .3s ease; will-change: transform; }
.card.top { z-index: 2; cursor: grab; }
.card.top:active { cursor: grabbing; }
.card.next { z-index: 1; transform: scale(.95) translateY(12px); pointer-events: none; }
.card.fly { z-index: 3; pointer-events: none; transition: transform .35s ease-in, opacity .35s ease-in; opacity: 0; }
.card.drag { transition: none; }
.media { position: relative; flex: 1; min-height: 0; background: #000; }
.media img { width: 100%; height: 100%; object-fit: contain; display: block; pointer-events: none; -webkit-user-drag: none; }
.media .none { height: 100%; display: flex; align-items: center; justify-content: center; color: #9a9aa3; }
.media.broken img { visibility: hidden; }
.media.broken::after { content: 'Image unavailable'; position: absolute; inset: 0; display: flex; align-items: center;
  justify-content: center; color: #9a9aa3; }
.dots { position: absolute; top: 8px; left: 10px; right: 10px; display: flex; gap: 4px; }
.dots span { flex: 1; height: 3px; border-radius: 2px; background: rgba(255,255,255,.35); box-shadow: 0 0 2px rgba(0,0,0,.5); }
.dots span.on { background: #fff; }
.stamp { position: absolute; top: 30px; padding: 2px 12px; border: 4px solid; border-radius: 8px; font-weight: 800;
  font-size: 28px; letter-spacing: .06em; opacity: 0; background: rgba(0,0,0,.25); }
.stamp.want { left: 18px; color: var(--like); transform: rotate(-14deg); }
.stamp.hide { right: 18px; color: var(--nope); transform: rotate(14deg); }
.info { padding: 10px 14px 12px; display: flex; flex-direction: column; gap: 6px; }
.badges, .tags { display: flex; flex-wrap: wrap; gap: 6px; }
.badge { padding: 1px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap;
  background: color-mix(in srgb, var(--bc, #888) 22%, transparent); border: 1px solid var(--bc, #888); }
.b-score { --bc: #2f6fdf; } .b-vr { --bc: #a46ad6; } .b-flat { --bc: #8b8b93; } .b-multi { --bc: #14b8a6; }
.b-single { --bc: #8b8b93; } .b-videos { --bc: #d08b2c; } .b-cream { --bc: #e0529c; } .b-time { --bc: #6b7280; }
.b-hand { --bc: #14b8a6; } .b-music { --bc: #d08b2c; } .b-ai { --bc: #8b8b93; } .b-slr { --bc: #e8743b; }
.b-fav { --bc: #e0529c; }
a.badge { color: var(--fg); }
.quota { width: min(100% - 32px, 528px); margin: -2px auto 8px; font-size: 13px; color: var(--muted); text-align: center;
  font-variant-numeric: tabular-nums; }
.quota b { color: var(--fg); }
.quota .err { color: var(--nope); }
.heat { display: block; width: 100%; height: 16px; border-radius: 4px; background: #000; image-rendering: pixelated; }
.tag { font-size: 12px; padding: 2px 8px; border-radius: 6px; background: var(--row); white-space: nowrap; }
.tag b { color: var(--like); font-variant-numeric: tabular-nums; }
.tag b.neg { color: var(--nope); }
.tag b.zero { color: var(--muted); font-weight: 400; }
.tag.best { font-weight: 650; box-shadow: inset 0 0 0 1.5px var(--like); }
.ttl { font-weight: 650; font-size: 16px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2;
  -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.by { display: flex; gap: 10px; color: var(--muted); font-size: 13px; }
.by a { margin-left: auto; font-size: 12px; white-space: nowrap; }
/* The full post details: only in the wide (side panel) layout. */
.sect, .facts, .scenes, .info .all-tags { display: none; }
.sect { font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: .05em; color: var(--muted);
  margin-top: 4px; }
.facts { grid-template-columns: auto 1fr; gap: 3px 14px; margin: 0; font-size: 13px; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; overflow-wrap: anywhere; }
.scenes { list-style: none; margin: 0; padding: 0; flex-direction: column; gap: 6px; font-size: 13px; }
.scenes li { padding: 5px 8px; border-radius: 6px; background: var(--row); }
.scenes .sn { overflow-wrap: anywhere; }
.scenes .sm { color: var(--muted); font-size: 12px; }
/* Desktop and landscape tablets: the image large on the left, every detail in a scrolling panel beside it. */
@media (min-width: 900px) {
  .bar { width: min(100%, 1280px); }
  .stacks, .quota { width: min(100% - 32px, 1248px); }
  .problems, .deck { width: min(100% - 32px, 1248px); }
  .card { flex-direction: row; }
  .media { flex: 1 1 auto; min-width: 0; min-height: auto; }
  .info { flex: 0 0 clamp(340px, 34%, 460px); overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y;
    padding: 16px 18px; gap: 9px; border-left: 1px solid var(--line); }
  .info .ttl { order: -2; display: block; font-size: 19px; }
  .info .by { order: -1; }
  .heat { height: 44px; border-radius: 6px; flex: none; }
  .info .top-tags { display: none; }
  .sect { display: block; }
  .facts { display: grid; }
  .scenes, .info .all-tags { display: flex; }
}
.empty { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 8px; color: var(--muted); text-align: center; padding: 20px; }
.actions { display: flex; justify-content: center; align-items: center; gap: 24px;
  padding: 12px 0 calc(10px + env(safe-area-inset-bottom)); }
.round { width: 64px; height: 64px; border-radius: 50%; font-size: 28px; line-height: 1; cursor: pointer; padding: 0;
  border: 1px solid var(--line); background: var(--panel); box-shadow: 0 2px 10px rgba(0,0,0,.14);
  touch-action: manipulation; }
.round.small { width: 48px; height: 48px; font-size: 22px; }
.round:disabled { opacity: .4; cursor: default; }
.round.nope { color: var(--nope); } .round.like { color: var(--like); } .round.undo { color: var(--undo); }
.round.skip { color: var(--accent); }
.hint { text-align: center; color: var(--muted); font-size: 12px; padding-bottom: 8px; }
@media (hover: none) { .hint { display: none; } }
.toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translateX(-50%);
  background: var(--warn-bg); color: var(--warn-fg); padding: 8px 14px; border-radius: 8px; z-index: 10;
  box-shadow: 0 2px 10px rgba(0,0,0,.2); max-width: 90vw; }
</style>
</head>
<body>
<header class="bar">
  <h1>Swipe</h1>
  <span class="counter" id="counter">Loading…</span>
  <button type="button" id="refresh" title="Refresh: load the deck again (new images, runtimes, heat strips; skipped cards come back)" aria-label="Refresh">↻</button>
  <button type="button" id="shuffle" title="Shuffle: deal the deck in a new order" aria-label="Shuffle">⇄</button>
  <button type="button" id="gear" title="Shuffle settings: how far each stack's order may wander" aria-label="Shuffle settings" aria-expanded="false" aria-controls="settings">⚙</button>
  <a href="/">Report</a>
  <div class="settings" id="settings" hidden>
    <label>Multi-axis shuffle ± <input type="number" id="jitter-multi" data-stack="multi" min="0" max="30" step="0.5" inputmode="decimal"></label>
    <label>Single-axis shuffle ± <input type="number" id="jitter-single" data-stack="single" min="0" max="30" step="0.5" inputmode="decimal"></label>
    <label>SLR shuffle ± <input type="number" id="jitter-slr" data-stack="slr" min="0" max="30" step="0.5" inputmode="decimal"></label>
    <div class="note">Score points each card may move either way, 0–30 (0 = strictly by score). Empty = the default (±4 multi-axis, ±10 single-axis, ±2 SLR). Saved on this device.</div>
    <button type="button" class="reset" id="jitter-reset">Reset to defaults</button>
  </div>
</header>
<nav class="stacks" id="stacks" aria-label="Which posts">
  <button type="button" data-stack="multi" title="Multi-axis posts only">Multi-axis</button>
  <button type="button" data-stack="single" title="Single-axis posts only">Single-axis</button>
  <button type="button" data-stack="slr" title="Downloads from SexLikeReal: EroScripts posts whose video is on SLR, and SLR scenes from npm run slr:scout">SLR</button>
</nav>
<div class="quota" id="quota" hidden></div>
<div class="problems" id="problems" hidden></div>
<main class="deck" id="deck">
  <div class="empty" id="empty">Loading…</div>
</main>
<div class="actions">
  <button type="button" class="round nope" id="nope" title="Hide from the deck (←)" aria-label="Hide">✕</button>
  <button type="button" class="round small undo" id="undo" title="Undo (Backspace)" aria-label="Undo">↺</button>
  <button type="button" class="round small skip" id="skip" title="Skip: it comes back later in the deck (↓)" aria-label="Skip">↷</button>
  <button type="button" class="round like" id="like" title="Want: the scout downloads it (→)" aria-label="Want">♥</button>
</div>
<div class="hint">← hide · → want · ↓ or drag up skip · Backspace undo · Space next image · tap the image's sides to browse</div>
<div class="toast" id="toast" hidden></div>

<script>
'use strict';
const BATCH = 20;
const REFILL_AT = 5;
// The deal's shuffle: the server shifts every score by up to ±4 on the multi-axis stack (it stays
// close to score order) and ±10 on the single-axis one (low scorers come up too) for this seed,
// unless ⚙ sets another amplitude for the stack; Shuffle (or a page reload) deals a new order.
const newSeed = () => Math.floor(Math.random() * 2 ** 32);
let seed = newSeed();
let generation = 0;     // bumped by Refresh / Shuffle / a stack change: answers to older deck requests are dropped
// Which stack is dealt (multi, single, slr); remembered on this device. Any other stored value
// (e.g. a tab that no longer exists) falls back to multi.
let stack = ['multi', 'single', 'slr'].includes(localStorage.getItem('swipeStack')) ? localStorage.getItem('swipeStack') : 'multi';
// Where a card's swipe goes: SLR scenes from slr:scout (source "slr") to /api/slr/… and
// slr-scout-swipes.json; EroScripts posts (no source, or "eroscripts"; on the SLR tab the ones
// whose video is on SLR) to /api/… and eroscripts-scout-swipes.json.
const isScene = (c) => c.source === 'slr';
const apiOf = (c) => (isScene(c) ? '/api/slr' : '/api');
// A card's identity: posts and SLR scenes have separate id ranges that may overlap.
const keyOf = (c) => (isScene(c) ? 's' : 'p') + c.id;
const STACK_NAMES = { multi: 'Multi-axis', single: 'Single-axis', slr: 'SLR' };
// ⚙ shuffle amplitude per stack, in score points; unset = the server's default (deck.rs
// MULTI_JITTER / SINGLE_JITTER, slr.rs SLR_JITTER), shown as the placeholder. Remembered on this device.
const JITTER_DEFAULT = { multi: 4, single: 10, slr: 2 };
const JITTER_MAX = 30;
const validJitter = (n) => typeof n === 'number' && Number.isFinite(n) && n >= 0 && n <= JITTER_MAX;
let jitters = (() => {
  try {
    const v = JSON.parse(localStorage.getItem('swipeJitter') || '{}');
    return Object.fromEntries(Object.entries(v).filter(([k, n]) => k in JITTER_DEFAULT && validJitter(n)));
  } catch {
    return {};
  }
})();
const $ = (id) => document.getElementById(id);
const deckEl = $('deck');

function el(tag, attrs, ...children) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') n.className = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? '' : v);
  }
  for (const c of children.flat()) {
    if (c == null || c === false) continue;
    n.append(c instanceof Node ? c : String(c));
  }
  return n;
}

let queue = [];         // cards not swiped yet; queue[0] is on top
const undoStack = [];   // {card, dir, stack}, newest last; dir 'skip' never reached the server
let skipped = [];       // skipped cards waiting to go back into the deck
let remaining = 0;
let wanted = 0;
let image = 0;          // the top card's image
let loading = false;
let exhausted = false;  // the server has no card beyond the queue
let loadError = null;
let loaded = false;    // the first deck arrived
let since = null;      // counter changes since the deck request in flight was sent

// Swipes, undos and deck fetches reach the server in order.
let chain = Promise.resolve();
function serial(fn) {
  const p = chain.then(fn);
  chain = p.catch(() => {});
  return p;
}

async function post(path, body) {
  const res = await fetch(path, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
  });
  if (!res.ok) throw new Error((await res.text()).trim() || res.status);
  return res.json();
}

let toastTimer = 0;
function toast(msg) {
  $('toast').textContent = msg;
  $('toast').hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { $('toast').hidden = true; }, 5000);
}

const fmt = (n) => String(Math.round(n * 10) / 10);
const signed = (n) => (n > 0 ? '+' : '') + fmt(n);
const day = (iso) => (iso ? iso.slice(0, 10) : '');
const fmtBytes = (n) => (n >= 1e9 ? (n / 1e9).toFixed(2) + ' GB' : (n / 1e6).toFixed(0) + ' MB');

/** m:ss, or h:mm:ss from an hour. */
function clock(ms) {
  const s = Math.round(ms / 1000);
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const ss = String(s % 60).padStart(2, '0');
  return h ? `${h}:${String(m).padStart(2, '0')}:${ss}` : `${m}:${ss}`;
}

function badges(c) {
  if (isScene(c)) return slrBadges(c);
  const out = [el('span', { class: 'badge b-score', title: 'Score' }, c.score == null ? '★ –' : '★ ' + fmt(c.score))];
  if (c.runtimeMs) out.push(el('span', { class: 'badge b-time', title: c.videos > 1 ? 'Length of the first video' : 'Length' }, '⏱ ' + clock(c.runtimeMs)));
  out.push(c.vr ? el('span', { class: 'badge b-vr' }, 'VR') : el('span', { class: 'badge b-flat' }, 'Flat'));
  const multi = c.axisType ? c.axisType === 'multi' : typeof c.axes === 'number' && c.axes > 1;
  if (multi) {
    out.push(el('span', { class: 'badge b-multi' }, c.axes === 'packed' ? 'Multi-axis (packed)'
      : typeof c.axes === 'number' && c.axes > 1 ? `Multi-axis (${c.axes})` : 'Multi-axis'));
  } else {
    out.push(el('span', { class: 'badge b-single' }, c.axes === 'packed' ? 'Single-axis (packed)' : 'Single-axis'));
  }
  if (c.videos > 1) out.push(el('span', { class: 'badge b-videos' }, `${c.videos} videos`));
  if (c.creampie) out.push(el('span', { class: 'badge b-cream' }, 'Creampie'));
  // On the SLR tab: the post's video comes from SexLikeReal (the user's account).
  if (c.slrVideo) {
    out.push(c.slrVideo.url
      ? el('a', { class: 'badge b-slr', href: c.slrVideo.url, target: '_blank', rel: 'noopener noreferrer', title: 'The video downloads from SexLikeReal' }, 'video: SLR ↗')
      : el('span', { class: 'badge b-slr', title: 'The video downloads from SexLikeReal' }, 'video: SLR'));
  }
  return out;
}

// Where an SLR scene's download takes the script from (slr-scout.json `scriptSource`).
const SCRIPT_SOURCES = { eroscripts: 'EroScripts (free)', 'slr-handcrafted': 'SLR hand-crafted', 'slr-ai': 'SLR AI' };
const scriptLabel = (s) => 'script: ' + (SCRIPT_SOURCES[s] || s || 'none');

/** An SLR scene: score, length, VR, creampie, where the script comes from, a favourite, PMV, compilation. */
function slrBadges(c) {
  const parts = c.scoreParts || {};
  const why = Object.entries(parts).map(([k, v]) => `${k} ${signed(v)}`).join(', ');
  const out = [el('span', { class: 'badge b-score', title: why ? 'Score: ' + why : 'Score' }, c.score == null ? '★ –' : '★ ' + fmt(c.score))];
  if (c.runtimeMs) out.push(el('span', { class: 'badge b-time', title: 'Length' }, '⏱ ' + clock(c.runtimeMs)));
  out.push(c.vr ? el('span', { class: 'badge b-vr' }, 'VR') : el('span', { class: 'badge b-flat' }, 'Flat'));
  if (c.creampie) out.push(el('span', { class: 'badge b-cream' }, 'Creampie'));
  const hand = c.handmade || [];
  const scripts = [...hand.map(handLabel), c.aiScript ? 'SLR AI script' : null].filter(Boolean).join('\n');
  out.push(el('span', { class: c.scriptSource ? 'badge b-hand' : 'badge b-ai', title: scripts || 'No script found' }, scriptLabel(c.scriptSource)));
  if (c.favourite) out.push(el('span', { class: 'badge b-fav', title: 'Favourite' }, '♥ ' + c.favourite));
  if (c.pmv) out.push(el('span', { class: 'badge b-music' }, 'PMV'));
  if (c.compilation) out.push(el('span', { class: 'badge b-music' }, 'Compilation'));
  return out;
}

/** Where a hand-made script for an SLR scene is: SLR's own (hand-crafted), or an EroScripts post. */
function handLabel(h) {
  if (h.source === 'slr') return 'SLR hand-crafted script' + (h.author ? ' by ' + h.author : '');
  const kind = [h.free ? 'free' : 'paid', h.multiAxis ? 'multi-axis' : null].filter(Boolean).join(', ');
  return `EroScripts #${h.topicId} (${kind})` + (h.title ? ': ' + h.title : '');
}

// The player's script heatmap colours (renderer/js/action-graph.js speedToColor): black, blue,
// cyan, green, yellow, red; 300 position units per second and faster is red.
const HEAT_STOPS = [[0, 0, 0], [0, 0, 255], [0, 255, 255], [0, 255, 0], [255, 255, 0], [255, 0, 0]];
const HEAT_MAX = 300;
function heatColor(speed) {
  const t = Math.min(1, speed / HEAT_MAX) * (HEAT_STOPS.length - 1);
  const lo = Math.floor(t);
  const hi = Math.min(lo + 1, HEAT_STOPS.length - 1);
  const f = t - lo;
  const [r, g, b] = HEAT_STOPS[lo].map((v, i) => Math.round(v + (HEAT_STOPS[hi][i] - v) * f));
  return `rgb(${r},${g},${b})`;
}

/** The main script's speed over time, one block per bin (the post's first video). */
function heatStrip(heat) {
  if (!heat || !heat.length) return null;
  const canvas = el('canvas', { class: 'heat', width: heat.length, height: 1, title: 'Script heatmap' });
  const ctx = canvas.getContext('2d');
  heat.forEach((speed, i) => {
    if (speed <= 0) return;
    ctx.fillStyle = heatColor(speed);
    ctx.fillRect(i, 0, 1, 1);
  });
  return canvas;
}

function cardNode(c, isTop) {
  const imgs = c.images || [];
  const media = el('div', { class: 'media' });
  if (imgs.length) {
    const img = el('img', { alt: '', draggable: 'false', decoding: 'async', src: imgs[isTop ? image : 0] });
    img.addEventListener('error', () => media.classList.add('broken'));
    img.addEventListener('load', () => media.classList.remove('broken'));
    media.append(img);
    if (imgs.length > 1) {
      media.append(el('div', { class: 'dots' }, imgs.map((_, i) => el('span', { class: i === (isTop ? image : 0) ? 'on' : null }))));
    }
  } else {
    media.append(el('div', { class: 'none' }, 'No image'));
  }
  media.append(el('div', { class: 'stamp want' }, 'WANT'), el('div', { class: 'stamp hide' }, 'HIDE'));
  const slr = isScene(c);
  const best = new Set((c.topTags || []).map((t) => t.tag));
  const tagTop = (c.topTags || []).map((t) => el('span', { class: 'tag' }, t.tag + ' ', el('b', {}, '+' + fmt(t.score))));
  const topTags = slr
    ? [...tagTop, ...(c.handmade || []).map((h) => h.source === 'eroscripts'
      ? el('a', { class: 'tag', href: 'https://discuss.eroscripts.com/t/' + h.topicId, target: '_blank', rel: 'noopener noreferrer', title: h.title || null },
        `EroScripts #${h.topicId} ` + (h.free ? 'free' : 'paid'))
      : el('span', { class: 'tag' }, 'SLR hand-crafted' + (h.author ? ' · ' + h.author : '')))]
    : tagTop;
  const node = el('article', { class: 'card ' + (isTop ? 'top' : 'next') },
    media,
    el('div', { class: 'info' },
      el('div', { class: 'badges' }, badges(c)),
      heatStrip(c.heat),
      el('div', { class: 'ttl', title: c.title || null }, c.title || '#' + c.id),
      el('div', { class: 'by' },
        c.author ? el('span', {}, (slr ? '' : 'by ') + c.author) : null,
        el('a', { href: c.url, target: '_blank', rel: 'noopener noreferrer' }, (slr ? 'SLR ' : '#' + c.id + ' ') + '↗')),
      topTags.length ? el('div', { class: 'tags top-tags' }, topTags) : null,
      slr ? slrDetails(c, best) : details(c, best)));
  if (isTop) drag(node);
  return node;
}

/** Every tag with its tag score (best ones outlined); a null score (an SLR scene the scout didn't score) shows the tag alone. */
function tagChips(tags, best) {
  return el('div', { class: 'tags all-tags' }, tags.map((t) => (t.score == null
    ? el('span', { class: 'tag' }, t.tag)
    : el('span', { class: best.has(t.tag) ? 'tag best' : 'tag', title: 'Tag score ' + fmt(t.score) }, t.tag + ' ',
      el('b', { class: t.score < 0 ? 'neg' : t.score > 0 ? null : 'zero' }, signed(t.score))))));
}

/** The wide layout's extra sections: every tag with its score, the post's facts, and its scenes. */
function details(c, best) {
  const out = [];
  const tags = c.tags || [];
  if (tags.length) out.push(el('div', { class: 'sect' }, 'Tags'), tagChips(tags, best));
  const facts = [
    ['Likes', c.likes],
    ['Hosts', c.hosts && c.hosts.length ? c.hosts.join(', ') : null],
    ['Size', c.gb != null ? c.gb + ' GB' : null],
    ['Created', day(c.created) || null],
    ['Last activity', day(c.bumped) || null],
  ].filter(([, v]) => v != null);
  if (facts.length) {
    out.push(el('div', { class: 'sect' }, 'Post'), el('dl', { class: 'facts' }, facts.flatMap(([k, v]) => [el('dt', {}, k), el('dd', {}, v)])));
  }
  const scenes = c.scenes || [];
  if (scenes.length) {
    const total = scenes.length + (c.moreScenes || 0);
    out.push(el('div', { class: 'sect' }, total > 1 ? `Scenes (${total})` : 'Scene'), el('ol', { class: 'scenes' },
      scenes.map((s) => el('li', {},
        el('div', { class: 'sn' }, s.name || '(unnamed)'),
        el('div', { class: 'sm' }, [
          s.host,
          s.size != null ? fmtBytes(s.size) : null,
          s.runtimeMs ? '⏱ ' + clock(s.runtimeMs) : null,
          s.axes && s.axes.length ? 'axes: ' + s.axes.join(', ') : null,
        ].filter(Boolean).join(' · ') || ' '))),
      c.moreScenes ? el('li', { class: 'sm' }, `+ ${c.moreScenes} more`) : null));
  }
  return out;
}

/** The wide layout's sections for an SLR scene: its facts, tags, the score's parts and its hand-made scripts. */
function slrDetails(c, best) {
  const out = [];
  const facts = [
    ['Script', scriptLabel(c.scriptSource).slice('script: '.length)],
    ['Performers', c.actors && c.actors.length ? c.actors.join(', ') : null],
    ['Favourite', c.favourite],
    ['Studio', c.author],
    ['Released', c.date],
    ['Favourites', c.favorites],
    ['FPS', c.fps],
    ['Passthrough', c.passthrough ? 'yes' : null],
    ['SLR AI script', c.aiScript ? 'yes' : null],
  ].filter(([, v]) => v != null);
  out.push(el('div', { class: 'sect' }, 'Scene'), el('dl', { class: 'facts' }, facts.flatMap(([k, v]) => [el('dt', {}, k), el('dd', {}, v)])));
  const tags = c.tags || [];
  if (tags.length) out.push(el('div', { class: 'sect' }, 'Tags'), tagChips(tags, best));
  const parts = Object.entries(c.scoreParts || {});
  if (parts.length) {
    out.push(el('div', { class: 'sect' }, 'Score'), el('div', { class: 'tags all-tags' },
      parts.map(([k, v]) => el('span', { class: 'tag' }, k + ' ', el('b', { class: v < 0 ? 'neg' : v > 0 ? null : 'zero' }, signed(v))))));
  }
  const hand = c.handmade || [];
  if (hand.length) {
    out.push(el('div', { class: 'sect' }, 'Hand-made scripts'), el('ol', { class: 'scenes' }, hand.map((h) => el('li', {},
      h.source === 'eroscripts'
        ? el('a', { class: 'sn', href: 'https://discuss.eroscripts.com/t/' + h.topicId, target: '_blank', rel: 'noopener noreferrer' }, h.title || '#' + h.topicId)
        : el('div', { class: 'sn' }, 'SLR hand-crafted script'),
      el('div', { class: 'sm' }, h.source === 'eroscripts'
        ? ['EroScripts #' + h.topicId, h.free ? 'free' : 'paid', h.multiAxis ? 'multi-axis' : null].filter(Boolean).join(' · ')
        : (h.author ? 'by ' + h.author + ' · ' : '') + 'counts against the hand-crafted script quota')))));
  }
  return out;
}

/** The SLR tab's line: the account's downloads left, as slr:scout last read them (videos count for EroScripts posts on SLR too). */
function renderQuota(d) {
  const q = $('quota');
  if (stack !== 'slr' || !d) { q.hidden = true; return; }
  const left = (x) => (x && x.total != null ? el('b', {}, `${x.remaining} of ${x.total}`) : null);
  const quota = d.quota || {};
  const line = [];
  const videos = left(quota.videos);
  if (videos) line.push('Videos left ', videos, ' (7 days)');
  const scripts = [[left(quota.scripts), ' hand-crafted'], [left(quota.aiScripts), ' AI']].filter(([b]) => b);
  if (scripts.length) {
    line.push(line.length ? ' · scripts this month ' : 'Scripts this month ', ...scripts.flatMap(([b, what], i) => (i ? [' · ', b, what] : [b, what])));
  }
  if (line.length) {
    if (quota.checkedAt) line.push(` · checked ${day(quota.checkedAt)}`);
  } else if (!d.generatedAt) {
    line.push('No slr:scout run yet: npm run slr:scout');
  } else {
    line.push('Quota not read yet');
  }
  if (d.quotaError) {
    const login = /session/i.test(d.quotaError) ? ': npm run slr:scout -- --login' : '';
    line.push(' ', el('span', { class: 'err' }, `(${d.quotaError}${login})`));
  }
  q.replaceChildren(...line);
  q.hidden = false;
}

const preloaded = new Set();
function preload(url) {
  if (!url || preloaded.has(url)) return;
  preloaded.add(url);
  new Image().src = url;
}

function renderCounter() {
  $('counter').textContent = loaded ? `${remaining} left · ${wanted} wanted` : 'Loading…';
  $('undo').disabled = !undoStack.length;
  $('nope').disabled = $('like').disabled = $('skip').disabled = !queue.length;
}

/** Redraw the top two cards (a card flying off stays until its animation ends). */
function render(enterFrom) {
  for (const n of deckEl.querySelectorAll('.card:not(.fly)')) n.remove();
  renderCounter();
  const empty = $('empty');
  if (!queue.length) {
    empty.hidden = false;
    empty.replaceChildren(...(loadError ? ['Could not load the deck: ' + loadError, el('button', { type: 'button', class: 'round small', onclick: reload, title: 'Retry' }, '⟳')]
      : loading ? ['Loading…']
      : stack === 'slr' ? ['Nothing on SexLikeReal left to swipe.', el('span', {}, 'npm run slr:scout and npm run eroscripts:scout find more.')]
      : ['Nothing left to swipe.', el('a', { href: '/' }, 'Back to the report')]));
    return;
  }
  empty.hidden = true;
  if (queue[1]) deckEl.append(cardNode(queue[1], false));
  const top = cardNode(queue[0], true);
  if (enterFrom) {
    top.classList.add('drag');
    top.style.transform = enterFrom === 'skip' ? 'translateY(-120%)'
      : `translateX(${enterFrom === 'right' ? '' : '-'}120%) rotate(${enterFrom === 'right' ? 20 : -20}deg)`;
  }
  deckEl.append(top);
  if (enterFrom) {
    requestAnimationFrame(() => requestAnimationFrame(() => {
      top.classList.remove('drag');
      top.style.transform = '';
    }));
  }
  // Only what's shown next: the top card's next image and the next card's first. Forum GIFs run
  // 3–7 MB each, so loading every image of a card up front made swiping lag on a phone.
  preload((queue[0].images || [])[image + 1]);
  if (queue[1]) preload((queue[1].images || [])[0]);
}

function topNode() {
  return deckEl.querySelector('.card.top:not(.fly)');
}

function showImage(i) {
  const c = queue[0];
  const imgs = (c && c.images) || [];
  if (imgs.length < 2) return;
  image = (i + imgs.length) % imgs.length;
  const node = topNode();
  if (!node) return;
  node.querySelector('.media img').src = imgs[image];
  node.querySelectorAll('.dots span').forEach((d, j) => d.classList.toggle('on', j === image));
  preload(imgs[(image + 1) % imgs.length]);
}

function threshold() {
  return Math.min(140, deckEl.clientWidth * 0.28);
}

function setStamps(node, t) {
  node.querySelector('.stamp.want').style.opacity = Math.max(0, t);
  node.querySelector('.stamp.hide').style.opacity = Math.max(0, -t);
}

/** Pointer drag with tilt; past the threshold it commits, a tap browses the gallery. */
function drag(node) {
  let start = null;
  let dx = 0;
  let dy = 0;
  let moved = false;
  node.addEventListener('pointerdown', (e) => {
    if (e.button !== 0 || e.target.closest('a, button')) return;
    // The side panel's scrollbar scrolls, it doesn't drag.
    const panel = e.target.closest('.info');
    if (panel && e.clientX >= panel.getBoundingClientRect().left + panel.clientLeft + panel.clientWidth) return;
    start = { x: e.clientX, y: e.clientY };
    dx = dy = 0;
    moved = false;
    node.setPointerCapture(e.pointerId);
    node.classList.add('drag');
  });
  node.addEventListener('pointermove', (e) => {
    if (!start) return;
    dx = e.clientX - start.x;
    dy = e.clientY - start.y;
    if (!moved && Math.hypot(dx, dy) < 8) return;
    moved = true;
    node.style.transform = `translate(${dx}px, ${dy * 0.3}px) rotate(${dx * 0.06}deg)`;
    setStamps(node, Math.max(-1, Math.min(1, dx / threshold())));
  });
  const end = (e) => {
    if (!start) return;
    start = null;
    node.classList.remove('drag');
    if (!moved) {
      // The card holds the pointer capture, so locate the tap by its coordinates.
      const r = node.querySelector('.media').getBoundingClientRect();
      if (e.type === 'pointerup' && e.clientY >= r.top && e.clientY <= r.bottom && e.clientX >= r.left && e.clientX <= r.right) {
        showImage(image + (e.clientX < r.left + r.width / 2 ? -1 : 1));
      }
      return;
    }
    if (Math.abs(dx) > threshold()) {
      swipe(dx > 0 ? 'right' : 'left', dy * 0.3);
    } else if (-dy > threshold()) {
      skip();
    } else {
      node.style.transform = '';
      setStamps(node, 0);
    }
  };
  node.addEventListener('pointerup', end);
  node.addEventListener('pointercancel', end);
}

function fly(node, dir, dy) {
  node.classList.remove('drag');
  node.classList.add('fly');
  if (dir === 'skip') {
    node.style.transform = `translateY(${-1.2 * window.innerHeight}px)`;
  } else {
    const sign = dir === 'right' ? 1 : -1;
    setStamps(node, sign);
    node.style.transform = `translate(${sign * 1.4 * window.innerWidth}px, ${dy || 0}px) rotate(${sign * 30}deg)`;
  }
  setTimeout(() => node.remove(), 400);
}

/** Change the counters; a deck request in flight hears of it too. */
function count(dRemaining, dWanted) {
  remaining = Math.max(0, remaining + dRemaining);
  wanted = Math.max(0, wanted + dWanted);
  if (since) {
    since.remaining += dRemaining;
    since.wanted += dWanted;
  }
}

function swipe(dir, dy) {
  const card = queue[0];
  if (!card) return;
  const node = topNode();
  if (node) fly(node, dir, dy);
  queue.shift();
  undoStack.push({ card, dir, stack });
  count(-1, dir === 'right' ? 1 : 0);
  image = 0;
  render();
  const from = stack;
  // Each card's own endpoint: a post to /api/swipe, an SLR scene to /api/slr/swipe.
  serial(() => post(apiOf(card) + '/swipe', { id: card.id, dir })).catch((e) => {
    // Not saved: put the card back on top (unless the page moved to another tab meanwhile).
    const i = undoStack.findIndex((u) => u.card === card);
    if (i >= 0) undoStack.splice(i, 1);
    if (stack !== from) { toast('Swipe not saved: ' + e.message); return; }
    if (!queue.some((c) => keyOf(c) === keyOf(card))) queue.unshift(card);
    count(1, dir === 'right' ? -1 : 0);
    image = 0;
    render();
    toast('Swipe not saved: ' + e.message);
  });
  if (queue.length <= REFILL_AT) more();
}

/** Put the top card aside; it goes back into the deck a few cards on (returnSkipped). Nothing is saved. */
function skip() {
  const card = queue[0];
  if (!card) return;
  const node = topNode();
  if (node) fly(node, 'skip');
  queue.shift();
  undoStack.push({ card, dir: 'skip', stack });
  skipped.push(card);
  image = 0;
  if (queue.length <= REFILL_AT) {
    if (exhausted) returnSkipped(); else more();
  }
  render();
}

/**
 * Shuffle the skipped cards back into the deck, each at a random place after the next
 * REFILL_AT cards (or anywhere when fewer are left), so they come back later, not at once.
 */
function returnSkipped() {
  for (const card of skipped) {
    const from = Math.min(REFILL_AT, queue.length);
    queue.splice(from + Math.floor(Math.random() * (queue.length - from + 1)), 0, card);
  }
  skipped = [];
}

function undo() {
  const last = undoStack.pop();
  if (!last) return;
  if (last.stack !== stack) {
    // Made on another tab: forget it there; this tab's cards and counters stay.
    if (last.dir === 'skip') return;
    serial(() => post(apiOf(last.card) + '/swipe/undo', { id: last.card.id }))
      .then(() => toast(`Undone on the ${STACK_NAMES[last.stack]} tab: ${last.card.title || '#' + last.card.id}`))
      .catch((e) => { undoStack.push(last); toast('Undo not saved: ' + e.message); });
    renderCounter();
    return;
  }
  queue = queue.filter((c) => keyOf(c) !== keyOf(last.card));
  queue.unshift(last.card);
  image = 0;
  if (last.dir === 'skip') {
    skipped = skipped.filter((c) => keyOf(c) !== keyOf(last.card));
    render('skip');
    return;
  }
  count(1, last.dir === 'right' ? -1 : 0);
  render(last.dir);
  serial(() => post(apiOf(last.card) + '/swipe/undo', { id: last.card.id })).catch((e) => {
    // The swipe still stands: take the card off again.
    queue = queue.filter((c) => keyOf(c) !== keyOf(last.card));
    undoStack.push(last);
    count(-1, last.dir === 'right' ? 1 : 0);
    image = 0;
    render();
    toast('Undo not saved: ' + e.message);
  });
}

/**
 * Fetch the next cards in this deal's order (seed). The server leaves out everything swiped
 * so far and the cards this page holds (on screen or skipped); skipped ones then go back in.
 */
function more() {
  if (loading || exhausted) return;
  loading = true;
  since = { remaining: 0, wanted: 0 };
  const gen = generation;
  // The cards this page holds: posts by topic id (exclude), SLR scenes by scene id (excludeScenes).
  const held = [...queue, ...skipped];
  const ids = (scenes) => held.filter((c) => isScene(c) === scenes).map((c) => c.id).join(',');
  serial(async () => {
    const jitter = jitters[stack] == null ? '' : `&jitter=${jitters[stack]}`;
    const which = stack === 'slr' ? `/api/slr/deck?excludeScenes=${ids(true)}&` : `/api/deck?stack=${stack}&`;
    const res = await fetch(`${which}limit=${BATCH}&seed=${seed}${jitter}&exclude=${ids(false)}`, { cache: 'no-store' });
    if (!res.ok) throw new Error((await res.text()).trim() || res.status);
    return res.json();
  }).then((d) => {
    if (gen !== generation) return; // dealt before a refresh or shuffle
    loadError = null;
    // The server answered before the swipes made since the request: count them on top.
    remaining = Math.max(0, d.remaining + since.remaining);
    wanted = Math.max(0, d.wanted + since.wanted);
    since = null;
    exhausted = d.cards.length < BATCH;
    // Swiped cards (a swipe still on its way to the server) don't come back; skipped ones may.
    const swiped = undoStack.filter((u) => u.dir !== 'skip' && u.stack === stack).map((u) => u.card);
    const have = new Set([...queue, ...skipped, ...swiped].map(keyOf));
    const fresh = d.cards.filter((c) => !have.has(keyOf(c)));
    const wasEmpty = !queue.length;
    queue.push(...fresh);
    returnSkipped();
    $('problems').hidden = !d.problems.length;
    $('problems').textContent = d.problems.join('\n');
    renderQuota(d);
    loading = false;
    if (wasEmpty) image = 0;
    loaded = true;
    if (wasEmpty) {
      render();
    } else {
      // Keep the top card (and a drag in progress); add the card under it if it was missing.
      if (queue[1] && !deckEl.querySelector('.card.next:not(.fly)')) {
        deckEl.append(cardNode(queue[1], false));
        preload((queue[1].images || [])[0]);
      }
      renderCounter();
    }
  }).catch((e) => {
    if (gen !== generation) return;
    loading = false;
    since = null;
    loadError = e.message;
    if (!queue.length) {
      returnSkipped();
      render();
    }
    if (queue.length) toast('Could not load more cards: ' + e.message);
  });
}

function reload() {
  exhausted = false;
  loadError = null;
  more();
  render();
}

/**
 * Deal the deck again from the server (new images, runtimes and heat strips the scout saved since,
 * skipped cards back in their place); `newOrder` also picks a new seed. Undo keeps working.
 */
function restart(newOrder) {
  generation++;
  if (newOrder) seed = newSeed();
  queue = [];
  skipped = [];
  image = 0;
  loading = false;
  since = null;
  reload();
}

$('refresh').addEventListener('click', (e) => { e.currentTarget.blur(); restart(false); });
$('shuffle').addEventListener('click', (e) => { e.currentTarget.blur(); restart(true); });

function showStack() {
  for (const b of $('stacks').querySelectorAll('button')) b.classList.toggle('on', b.dataset.stack === stack);
  $('like').title = stack === 'slr' ? 'Want: the scout downloads it from SexLikeReal (→)' : 'Want: the scout downloads it (→)';
  if (stack !== 'slr') renderQuota(null);
}
$('stacks').addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  b.blur();
  if (b.dataset.stack === stack) return;
  stack = b.dataset.stack;
  localStorage.setItem('swipeStack', stack);
  showStack();
  restart(false);
});
showStack();

/** ⚙: one shuffle amplitude per stack; a change to the dealt stack's re-deals it in the same seed. */
function showJitters() {
  for (const k of Object.keys(JITTER_DEFAULT)) {
    const input = $('jitter-' + k);
    input.placeholder = String(JITTER_DEFAULT[k]);
    input.value = jitters[k] == null ? '' : String(jitters[k]);
  }
}
function setJitters(next) {
  const before = jitters[stack];
  jitters = next;
  localStorage.setItem('swipeJitter', JSON.stringify(jitters));
  showJitters();
  if (jitters[stack] !== before) restart(false);
}
function toggleSettings(open) {
  $('settings').hidden = !open;
  $('gear').setAttribute('aria-expanded', String(open));
  if (open) showJitters();
}
$('gear').addEventListener('click', (e) => { e.currentTarget.blur(); toggleSettings($('settings').hidden); });
$('settings').addEventListener('change', (e) => {
  const input = e.target.closest('input');
  if (!input) return;
  const next = { ...jitters };
  if (input.value === '' && !input.validity.badInput) {
    delete next[input.dataset.stack];
  } else {
    const n = Number(input.value);
    if (input.validity.badInput || !Number.isFinite(n)) { showJitters(); return; }
    next[input.dataset.stack] = Math.min(JITTER_MAX, Math.max(0, n));
  }
  setJitters(next);
});
$('jitter-reset').addEventListener('click', (e) => { e.currentTarget.blur(); setJitters({}); });
document.addEventListener('pointerdown', (e) => {
  if (!$('settings').hidden && !e.target.closest('#settings, #gear')) toggleSettings(false);
});
showJitters();

// Buttons drop focus so Space keeps meaning "next image".
$('nope').addEventListener('click', (e) => { e.currentTarget.blur(); swipe('left'); });
$('like').addEventListener('click', (e) => { e.currentTarget.blur(); swipe('right'); });
$('undo').addEventListener('click', (e) => { e.currentTarget.blur(); undo(); });
$('skip').addEventListener('click', (e) => { e.currentTarget.blur(); skip(); });
document.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'Escape' && !$('settings').hidden) { toggleSettings(false); return; }
  // Typing in the ⚙ panel's fields: keys are theirs.
  if (e.target.closest && e.target.closest('input, select, textarea')) return;
  if (e.key === 'ArrowLeft') swipe('left');
  else if (e.key === 'ArrowRight') swipe('right');
  else if (e.key === 'ArrowDown') skip();
  else if (e.key === 'Backspace') undo();
  else if (e.key === ' ') showImage(image + 1);
  else return;
  e.preventDefault();
});

reload();
</script>
</body>
</html>
