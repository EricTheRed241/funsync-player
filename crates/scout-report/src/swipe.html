<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17181b" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='1.5' width='24' height='29' rx='5' fill='%23e0529c'/%3E%3Cpath d='M16 25.5C8.5 20.4 6.5 16.6 6.5 13.4 6.5 10.6 8.7 8.5 11.3 8.5c2 0 3.6 1.1 4.7 2.8 1.1-1.7 2.7-2.8 4.7-2.8 2.6 0 4.8 2.1 4.8 4.9 0 3.2-2 7-9.5 12.1z' fill='%23fff'/%3E%3C/svg%3E">
<title>Scout swipe</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #fafafa; --fg: #1d1d1f; --muted: #6b6b70; --line: #d9d9de; --panel: #ffffff;
  --accent: #2f6fdf; --row: #f2f2f5; --warn-bg: #fff4d6; --warn-fg: #6b4e00;
  --like: #3aa655; --nope: #e05252; --undo: #d08b2c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #17181b; --fg: #e6e6e9; --muted: #9a9aa3; --line: #34353b; --panel: #1f2024;
    --accent: #7aa7ff; --row: #2a2b31; --warn-bg: #3d3214; --warn-fg: #ffd98a;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; display: flex; flex-direction: column; height: 100dvh; overflow: hidden; overscroll-behavior: none;
  background: var(--bg); color: var(--fg); font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.bar { position: relative; display: flex; align-items: baseline; gap: 12px;
  padding: calc(10px + env(safe-area-inset-top)) 16px 6px; width: min(100%, 560px); margin: 0 auto; }
.bar h1 { font-size: 18px; margin: 0; }
.counter { color: var(--muted); margin-right: auto; font-variant-numeric: tabular-nums; white-space: nowrap; }
.bar button { background: none; border: none; padding: 0 4px; color: var(--accent); font: inherit; font-size: 20px;
  line-height: 1; cursor: pointer; white-space: nowrap; touch-action: manipulation; }
.settings { position: absolute; top: 100%; right: 12px; z-index: 20; width: min(300px, calc(100vw - 24px));
  display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; font-size: 13px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 6px 24px rgba(0,0,0,.22); }
.settings label { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.settings input { width: 76px; font: inherit; padding: 3px 6px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--bg); color: var(--fg); text-align: right; }
.settings .note { color: var(--muted); font-size: 12px; }
.settings .reset { align-self: flex-end; background: none; border: 1px solid var(--line); border-radius: 6px;
  padding: 3px 10px; font: inherit; font-size: 12px; color: var(--accent); cursor: pointer; }
.stacks { display: flex; gap: 0; width: min(100% - 32px, 528px); margin: 0 auto 8px; border: 1px solid var(--line);
  border-radius: 8px; overflow: hidden; }
.stacks button { flex: 1; background: none; border: none; border-radius: 0; padding: 6px 4px; font: inherit; font-size: 13px;
  color: var(--muted); cursor: pointer; touch-action: manipulation; }
.stacks button + button { border-left: 1px solid var(--line); }
.stacks button.on { background: color-mix(in srgb, var(--accent) 20%, transparent); color: var(--fg); font-weight: 600; }
.problems { background: var(--warn-bg); color: var(--warn-fg); padding: 6px 12px; border-radius: 6px;
  margin: 0 auto 6px; width: min(100% - 20px, 540px); white-space: pre-wrap; font-size: 13px; }
.deck { position: relative; flex: 1; min-height: 0; width: min(100% - 20px, 540px); margin: 4px auto 0; }
.card { position: absolute; inset: 0; display: flex; flex-direction: column; overflow: hidden;
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 6px 24px rgba(0,0,0,.18);
  touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  transition: transform .3s ease, opacity .3s ease; will-change: transform; }
.card.top { z-index: 2; cursor: grab; }
.card.top:active { cursor: grabbing; }
.card.next { z-index: 1; transform: scale(.95) translateY(12px); pointer-events: none; }
.card.fly { z-index: 3; pointer-events: none; transition: transform .35s ease-in, opacity .35s ease-in; opacity: 0; }
.card.drag { transition: none; }
.media { position: relative; flex: 1; min-height: 0; background: #000; }
.media img { width: 100%; height: 100%; object-fit: contain; display: block; pointer-events: none; -webkit-user-drag: none; }
.media .none { height: 100%; display: flex; align-items: center; justify-content: center; color: #9a9aa3; }
.media.broken > img { visibility: hidden; }
.media.broken::after { content: 'Image unavailable'; position: absolute; inset: 0; display: flex; align-items: center;
  justify-content: center; color: #9a9aa3; }
/* An image still on its way: a spinner over the card (after a moment, so quick ones don't flash it). */
.media.loading::before { content: ''; position: absolute; z-index: 1; top: 50%; left: 50%; width: 40px; height: 40px;
  margin: -20px 0 0 -20px; border-radius: 50%; border: 4px solid rgba(255,255,255,.25); border-top-color: #fff;
  opacity: 0; animation: spin .8s linear infinite, appear .2s ease-out .3s forwards; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes appear { to { opacity: 1; } }
.dots { position: absolute; top: 8px; left: 10px; right: 10px; display: flex; gap: 4px; }
.dots span { flex: 1; height: 3px; border-radius: 2px; background: rgba(255,255,255,.35); box-shadow: 0 0 2px rgba(0,0,0,.5); }
.dots span.on { background: #fff; }
/* The creators in a card: her picture as a round portrait and her name, over the image's bottom-left corner; a tap
   shows that picture in the gallery. */
.people { position: absolute; left: 10px; bottom: 10px; max-width: calc(100% - 20px); z-index: 2; display: flex;
  flex-direction: column; align-items: flex-start; gap: 6px; }
.person { display: flex; align-items: center; gap: 8px; max-width: 100%; padding: 3px 14px 3px 3px; border-radius: 999px;
  background: rgba(0,0,0,.62); color: #fff; font-size: 14px; font-weight: 600; line-height: 1.2; cursor: pointer;
  box-shadow: 0 1px 6px rgba(0,0,0,.35); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.person:hover { background: rgba(0,0,0,.78); }
.media .person img { flex: none; width: 44px; height: 44px; border-radius: 50%; object-fit: cover;
  border: 2px solid rgba(255,255,255,.85); background: #333; }
.person.on img { border-color: var(--accent); }
.person span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stamp { position: absolute; top: 30px; padding: 2px 12px; border: 4px solid; border-radius: 8px; font-weight: 800;
  font-size: 28px; letter-spacing: .06em; opacity: 0; background: rgba(0,0,0,.25); }
.stamp.want { left: 18px; color: var(--like); transform: rotate(-14deg); }
.stamp.hide { right: 18px; color: var(--nope); transform: rotate(14deg); }
/* Duplicates: two library videos side by side, the confidence on top, the stats at the bottom of each. */
.card.vs { flex-direction: column; }
.vs-head { padding: 10px 14px 8px; display: flex; flex-direction: column; gap: 4px; border-bottom: 1px solid var(--line); }
.vs-conf { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; }
.vs-conf b { font-size: 26px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.vs-conf b.hi { color: var(--like); } .vs-conf b.mid { color: var(--undo); } .vs-conf b.lo { color: var(--muted); }
.vs-meter { flex: 1 1 80px; align-self: center; height: 6px; border-radius: 3px; background: var(--row); position: relative; overflow: hidden; }
.vs-meter span { position: absolute; inset: 0 auto 0 0; background: currentColor; border-radius: 3px; }
.vs-why { color: var(--muted); font-size: 13px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
@media (max-width: 600px) {
  .vs-head { padding: 8px 10px 6px; }
  .vs-conf b { font-size: 22px; }
  .vs-why, .vs-note { font-size: 12px; }
  .vs-stats { font-size: 12px; gap: 1px 6px; padding: 4px 8px 8px; }
  .vs-side .ttl { font-size: 13px; padding: 4px 8px 0; }
  .vs-side .by { padding: 0 8px; }
}
.vs-note { align-self: flex-start; font-size: 12px; padding: 2px 8px; border-radius: 6px; background: var(--warn-bg); color: var(--warn-fg); }
.vs-scroll { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; }
.vs-sides { flex: 1 0 auto; display: grid; grid-template-columns: 1fr 1fr; }
.vs-side { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.vs-side + .vs-side { border-left: 1px solid var(--line); }
.vs-side .media { flex: none; height: clamp(150px, 34vh, 440px); }
.vs-side .ttl { font-size: 14px; line-height: 1.4; padding: 6px 10px 0; display: block; -webkit-line-clamp: unset; overflow: visible; }
.vs-side .file { padding: 0 10px; font-size: 11px; color: var(--muted); overflow-wrap: anywhere; }
.vs-side .by { padding: 0 10px; font-size: 12px; flex-wrap: wrap; gap: 2px 8px; }
.vs-side .by a { margin-left: 0; }
.vs-stats { display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; margin: 0; padding: 6px 10px 10px; font-size: 13px; }
.vs-stats dt { color: var(--muted); }
.vs-stats dd { margin: 0; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.vs-stats dd.win { color: var(--like); font-weight: 650; }
.vs-side .stamp { top: 14px; left: 50%; right: auto; transform: translateX(-50%) rotate(-8deg); font-size: 22px; }
.vs-side .stamp.keep { color: var(--like); } .vs-side .stamp.del { color: var(--nope); }
.stamp.distinct { left: 50%; top: 40%; transform: translate(-50%, -50%); color: var(--accent); font-size: 22px; white-space: nowrap; z-index: 1; }
.round.distinct { color: var(--accent); }
.info { padding: 10px 14px 12px; display: flex; flex-direction: column; gap: 6px; }
.badges, .tags { display: flex; flex-wrap: wrap; gap: 6px; }
.badge { padding: 1px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap;
  background: color-mix(in srgb, var(--bc, #888) 22%, transparent); border: 1px solid var(--bc, #888); }
.b-score { --bc: #2f6fdf; } .b-vr { --bc: #a46ad6; } .b-flat { --bc: #8b8b93; } .b-multi { --bc: #14b8a6; }
.b-single { --bc: #8b8b93; } .b-videos { --bc: #d08b2c; } .b-cream { --bc: #e0529c; } .b-time { --bc: #6b7280; }
.b-hand { --bc: #14b8a6; } .b-music { --bc: #d08b2c; } .b-ai { --bc: #8b8b93; } .b-slr { --bc: #e8743b; }
.b-fav { --bc: #e0529c; }
.b-src-eroscripts { --bc: #2f6fdf; } .b-src-slr { --bc: #e8743b; } .b-src-vrb { --bc: #d6336c; }
.b-src-pmvhaven { --bc: #9b59d0; } .b-src-faptap { --bc: #f08c00; }
.b-creator { --bc: #14b8a6; }
a.badge { color: var(--fg); }
/* The library drive's free space; red and swiping off below swipeDeck.minFreeGb. */
.drive { width: min(100% - 32px, 528px); margin: -2px auto 8px; font-size: 13px; color: var(--muted);
  font-variant-numeric: tabular-nums; }
.drive-line { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 10px; margin-bottom: 4px; }
.drive-line b { color: var(--fg); }
.drive.full .drive-line b, .drive .err { color: var(--nope); }
.meter { position: relative; height: 8px; border-radius: 4px; background: var(--row); }
.meter .used { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 4px; background: var(--like); }
.drive.low .meter .used { background: var(--undo); }
.drive.full .meter .used { background: var(--nope); }
.meter .limit { position: absolute; top: -3px; bottom: -3px; width: 2px; margin-left: -1px; background: var(--fg); opacity: .55; }
.scanned, .quota { width: min(100% - 32px, 528px); margin: -2px auto 8px; font-size: 13px; color: var(--muted); text-align: center;
  font-variant-numeric: tabular-nums; }
.quota b { color: var(--fg); }
.quota .err { color: var(--nope); }
.quota .delete-marked { margin-left: 8px; font: inherit; font-size: 13px; padding: 2px 10px; border-radius: 6px; cursor: pointer;
  border: 1px solid var(--nope); background: none; color: var(--nope); }
.quota .delete-marked:disabled { opacity: .4; cursor: default; }
.heat { display: block; width: 100%; height: 16px; border-radius: 4px; background: #000; image-rendering: pixelated; }
.tag { font-size: 12px; padding: 2px 8px; border-radius: 6px; background: var(--row); white-space: nowrap; }
.tag b { color: var(--like); font-variant-numeric: tabular-nums; }
.tag b.neg { color: var(--nope); }
.tag b.zero { color: var(--muted); font-weight: 400; }
.tag.best { font-weight: 650; box-shadow: inset 0 0 0 1.5px var(--like); }
.ttl { font-weight: 650; font-size: 16px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2;
  -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.by { display: flex; gap: 10px; color: var(--muted); font-size: 13px; }
.by a { margin-left: auto; font-size: 12px; white-space: nowrap; }
.by .date { font-size: 11px; white-space: nowrap; font-variant-numeric: tabular-nums; }
/* The full post details: only in the wide (side panel) layout. */
.sect, .facts, .scenes, .info .all-tags { display: none; }
.sect { font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: .05em; color: var(--muted);
  margin-top: 4px; }
.facts { grid-template-columns: auto 1fr; gap: 3px 14px; margin: 0; font-size: 13px; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; overflow-wrap: anywhere; }
.scenes { list-style: none; margin: 0; padding: 0; flex-direction: column; gap: 6px; font-size: 13px; }
.scenes li { padding: 5px 8px; border-radius: 6px; background: var(--row); }
.scenes .sn { overflow-wrap: anywhere; }
.scenes .sm { color: var(--muted); font-size: 12px; }
/* Desktop and landscape tablets: the image large on the left, every detail in a scrolling panel beside it. */
@media (min-width: 900px) {
  .bar { width: min(100%, 1280px); }
  .stacks, .scanned, .quota, .drive { width: min(100% - 32px, 1248px); }
  .problems, .deck { width: min(100% - 32px, 1248px); }
  .card { flex-direction: row; }
  .card.vs { flex-direction: column; }
  .vs-side .ttl { font-size: 16px; }
  .vs-stats { font-size: 14px; }
  .media { flex: 1 1 auto; min-width: 0; min-height: auto; }
  .info { flex: 0 0 clamp(340px, 34%, 460px); overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y;
    padding: 16px 18px; gap: 9px; border-left: 1px solid var(--line); }
  .info .ttl { order: -2; display: block; font-size: 19px; }
  .info .by { order: -1; }
  .heat { height: 44px; border-radius: 6px; flex: none; }
  .info .top-tags { display: none; }
  .sect { display: block; }
  .facts { display: grid; }
  .scenes, .info .all-tags { display: flex; }
}
.empty { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 8px; color: var(--muted); text-align: center; padding: 20px; }
.actions { display: flex; justify-content: center; align-items: center; gap: 24px;
  padding: 12px 0 calc(10px + env(safe-area-inset-bottom)); }
.round { width: 64px; height: 64px; border-radius: 50%; font-size: 28px; line-height: 1; cursor: pointer; padding: 0;
  border: 1px solid var(--line); background: var(--panel); box-shadow: 0 2px 10px rgba(0,0,0,.14);
  touch-action: manipulation; }
.round.small { width: 48px; height: 48px; font-size: 22px; }
.round:disabled { opacity: .4; cursor: default; }
.round.nope { color: var(--nope); } .round.like { color: var(--like); } .round.undo { color: var(--undo); }
.round.skip { color: var(--accent); }
.hint { text-align: center; color: var(--muted); font-size: 12px; padding-bottom: 8px; }
@media (hover: none) { .hint { display: none; } }
.toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translateX(-50%);
  background: var(--warn-bg); color: var(--warn-fg); padding: 8px 14px; border-radius: 8px; z-index: 10;
  box-shadow: 0 2px 10px rgba(0,0,0,.2); max-width: 90vw; }
</style>
</head>
<body>
<header class="bar">
  <h1>Swipe</h1>
  <span class="counter" id="counter">Loading…</span>
  <button type="button" id="refresh" title="Refresh: load the deck again (new images, runtimes, heat strips; skipped cards come back)" aria-label="Refresh">↻</button>
  <button type="button" id="shuffle" title="Shuffle: deal the deck in a new order" aria-label="Shuffle">⇄</button>
  <button type="button" id="gear" title="Shuffle settings: how far each stack's order may wander" aria-label="Shuffle settings" aria-expanded="false" aria-controls="settings">⚙</button>
  <div class="settings" id="settings" hidden>
    <label>Multi shuffle ± <input type="number" id="jitter-multi" data-stack="multi" min="0" max="30" step="0.5" inputmode="decimal"></label>
    <label>VR shuffle ± <input type="number" id="jitter-vr" data-stack="vr" min="0" max="30" step="0.5" inputmode="decimal"></label>
    <label>Flat shuffle ± <input type="number" id="jitter-flat" data-stack="flat" min="0" max="30" step="0.5" inputmode="decimal"></label>
    <div class="note">Score points each card may move either way, 0–30 (0 = strictly by score). Empty = the default (±4 Multi, ±3 VR, ±10 Flat). Saved on this device.</div>
    <button type="button" class="reset" id="jitter-reset">Reset to defaults</button>
  </div>
</header>
<nav class="stacks" id="stacks" aria-label="Which cards">
  <button type="button" data-stack="multi" title="Multi-axis scripts from every source: EroScripts posts and scenes with hand-made axes">Multi</button>
  <button type="button" data-stack="vr" title="Single-axis VR from every source: EroScripts posts, SLR, VRBangers / VRConk, PMVHaven and FapTap scenes">VR</button>
  <button type="button" data-stack="flat" title="Single-axis flat from every source: EroScripts posts, PMVHaven and FapTap videos">Flat</button>
  <button type="button" data-stack="free" title="Library videos to delete when a drive is full: the most GB per preference-score point first; favourites, 4★ and up, favourite artists and hand-made axes are never shown">Free space</button>
  <button type="button" data-stack="dupes" title="Library videos that may be the same video, side by side, the likeliest first: keep one (← / →) and the other is deleted when you press Delete marked, or ↑ not duplicates">Duplicates</button>
</nav>
<div class="drive" id="drive" hidden>
  <div class="drive-line" id="drive-line"></div>
  <div class="meter" id="drive-meter"><span class="used" id="drive-used"></span><span class="limit" id="drive-limit"></span></div>
</div>
<div class="scanned" id="scanned" hidden></div>
<div class="quota" id="quota" hidden></div>
<div class="quota" id="drives" hidden></div>
<div class="problems" id="problems" hidden></div>
<main class="deck" id="deck">
  <div class="empty" id="empty">Loading…</div>
</main>
<div class="actions">
  <button type="button" class="round nope" id="nope" title="Hide from the deck (←)" aria-label="Hide">✕</button>
  <button type="button" class="round small undo" id="undo" title="Undo (Backspace)" aria-label="Undo">↺</button>
  <button type="button" class="round small skip" id="skip" title="Skip: it comes back later in the deck (↓)" aria-label="Skip">↷</button>
  <button type="button" class="round small distinct" id="distinct" title="Not duplicates: never shown together again (↑)" aria-label="Not duplicates" hidden>↑</button>
  <button type="button" class="round like" id="like" title="Want: the scout downloads it (→)" aria-label="Want">♥</button>
</div>
<div class="hint" id="hint">← hide · → want · ↓ or drag up skip · Backspace undo · Space next image · tap the image's sides to browse</div>
<div class="toast" id="toast" hidden></div>

<script>
'use strict';
const BATCH = 20;
const REFILL_AT = 5;
// The deal's shuffle: the server shifts every score by up to ±4 on Multi (it stays close to
// score order), ±3 on VR and ±10 on Flat (low scorers come up too) for this seed, unless ⚙ sets
// another amplitude for the tab; Shuffle (or a page reload) deals a new order.
const newSeed = () => Math.floor(Math.random() * 2 ** 32);
let seed = newSeed();
let generation = 0;     // bumped by Refresh / Shuffle / a tab change: answers to older deck requests are dropped
// Which tab is dealt (multi, vr, flat, free); remembered on this device. Any other stored value
// (the old single-axis and SLR tabs) falls back to multi.
const STACKS = ['multi', 'vr', 'flat', 'free', 'dupes'];
let stack = STACKS.includes(localStorage.getItem('swipeStack')) ? localStorage.getItem('swipeStack') : 'multi';
// Where a card comes from, and so where its swipe goes: an EroScripts post (source
// "eroscripts") to /api/swipe and eroscripts-scout-swipes.json, a scout's scene (slr, vrb,
// pmvhaven, faptap) to /api/scenes/<source>/swipe and that scout's swipes file, a yes
// creator's post (source "creators", site eroscripts / faptap) to /api/scenes/creators/swipe
// and creator-swipes.json (creators:scout --fetch downloads it), a library video
// (source "library", the Free space tab) to /api/free-space/swipe and free-space-swipes.json.
const sourceOf = (c) => c.source || 'eroscripts';
const isLibrary = (c) => sourceOf(c) === 'library';
// A Duplicates pair (source "dupes"): /api/duplicates/swipe, duplicate-swipes.json.
const isPair = (c) => sourceOf(c) === 'dupes';
const isScene = (c) => sourceOf(c) !== 'eroscripts' && !isLibrary(c) && !isPair(c);
const swipePath = (c) => (isLibrary(c) ? '/api/free-space/swipe' : isPair(c) ? '/api/duplicates/swipe'

// Whether a swipe counts in the tab's second counter: a library video swiped left is marked for
// deletion, a pair swiped either side marks its other video, anything else swiped right is wanted.
const marks = (c, dir) => (isLibrary(c) ? dir === 'left' : isPair(c) ? dir === 'left' || dir === 'right' : dir === 'right');
// The two tabs that delete library videos: they free space, so a full drive never stops them.
const deletes = (s) => s === 'free' || s === 'dupes';
// A card's identity across sources (two sources' ids may be equal); also the deck's exclude key.
const keyOf = (c) => sourceOf(c) + ':' + c.id;
const STACK_NAMES = { multi: 'Multi', vr: 'VR', flat: 'Flat', free: 'Free space', dupes: 'Duplicates' };
// The scouts whose runs fill each tab: an empty tab names them.

  vr: ['eroscripts:scout', 'slr:scout', 'vrb:scout', 'pmvhaven:scout', 'faptap:scout', 'creators:scout'],

// creator card's `site` is the post's: EroScripts or FapTap.

const SITE_NAMES = { vrbangers: 'VRBangers', vrconk: 'VRConk', eroscripts: 'EroScripts', faptap: 'FapTap' };
const sourceName = (c) => SITE_NAMES[c.site] || SOURCE_NAMES[sourceOf(c)] || sourceOf(c);
// ⚙ shuffle amplitude per tab, in score points; unset = the server's default (deck.rs
// MULTI_JITTER / VR_JITTER / FLAT_JITTER), shown as the placeholder. Remembered on this device.
const JITTER_DEFAULT = { multi: 4, vr: 3, flat: 10 };
const JITTER_MAX = 30;
const validJitter = (n) => typeof n === 'number' && Number.isFinite(n) && n >= 0 && n <= JITTER_MAX;
let jitters = (() => {
  try {
    const v = JSON.parse(localStorage.getItem('swipeJitter') || '{}');
    return Object.fromEntries(Object.entries(v).filter(([k, n]) => k in JITTER_DEFAULT && validJitter(n)));
  } catch {
    return {};

})();
const $ = (id) => document.getElementById(id);

function el(tag, attrs, ...children) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') n.className = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? '' : v);
  }
  for (const c of children.flat()) {
    if (c == null || c === false) continue;
    n.append(c instanceof Node ? c : String(c));
  }
  return n;
}

// GET /api/drive: {drive: {mount, free, total} | null, minFreeBytes, full, problems}. While
// `full`, the download tabs take no swipes (the server refuses them with 507 too); skip, undo
// and the Free space tab still work.
let drive = null;
const driveFull = () => Boolean(drive && drive.full);
const swipeBlocked = () => driveFull() && !deletes(stack);

// Swipes, undos and deck fetches reach the server in order.
let chain = Promise.resolve();
function serial(fn) {
  const p = chain.then(fn);
  chain = p.catch(() => {});
  return p;
}

async function post(path, body) {
  const res = await fetch(path, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
  });
  if (!res.ok) {
    const e = new Error((await res.text()).trim() || res.status);
    e.status = res.status;
    throw e;
  }
  return res.json();
}

let toastTimer = 0;

  $('toast').hidden = false;
  clearTimeout(toastTimer);

}

const fmt = (n) => String(Math.round(n * 10) / 10);
const signed = (n) => (n > 0 ? '+' : '') + fmt(n);
const day = (iso) => (iso ? iso.slice(0, 10) : '');
/** "2026-01-02…" → "01-2026". */
const monthYear = (iso) => { const m = /^(\d{4})-(\d{2})/.exec(iso || ''); return m ? m[2] + '-' + m[1] : ''; };
const fmtBytes = (n) => (n >= 1e12 ? (n / 1e12).toFixed(2) + ' TB' : n >= 1e9 ? (n / 1e9).toFixed(2) + ' GB' : (n / 1e6).toFixed(0) + ' MB');

/** m:ss, or h:mm:ss from an hour. */
function clock(ms) {
  const s = Math.round(ms / 1000);
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const ss = String(s % 60).padStart(2, '0');
  return h ? `${h}:${String(m).padStart(2, '0')}:${ss}` : `${m}:${ss}`;
}

// Where an SLR scene's download takes the script from (slr-scout.json `scriptSource`).
const SCRIPT_SOURCES = { eroscripts: 'EroScripts (free)', 'slr-handcrafted': 'SLR hand-crafted', 'slr-ai': 'SLR AI' };
const scriptLabel = (s) => 'script: ' + (SCRIPT_SOURCES[s] || s || 'none');

/**
 * A scout's scene: score (its parts on hover), length, VR (passthrough, fps) or flat, its
 * script's axes (SLR: where the script comes from), creampie, a favourite, PMV, compilation,
 * FapTap's stream height.
 */
function sceneBadges(c) {
  const parts = c.scoreParts || {};
  const why = Object.entries(parts).map(([k, v]) => `${k} ${signed(v)}`).join(', ');
  const out = [el('span', { class: 'badge b-score', title: why ? 'Score: ' + why : 'Score' }, c.score == null ? '★ –' : '★ ' + fmt(c.score))];
  if (c.runtimeMs) out.push(el('span', { class: 'badge b-time', title: 'Length' }, '⏱ ' + clock(c.runtimeMs)));
  out.push(c.vr ? el('span', { class: 'badge b-vr' }, c.passthrough ? 'VR · passthrough' : 'VR') : el('span', { class: 'badge b-flat' }, 'Flat'));
  if (c.fps) out.push(el('span', { class: 'badge b-time', title: 'Frame rate' }, fmt(c.fps) + ' fps'));
  if (c.quality) out.push(el('span', { class: 'badge b-time', title: 'Stream height --fetch takes' }, c.quality + 'p'));
  const axes = c.axes || [];
  if (axes.length) {
    out.push(el('span', { class: 'badge b-multi', title: 'Script axes: stroke, ' + axes.join(', ') }, `Multi-axis (${axes.length + 1})`));
  } else if (c.multiAxis) {

    out.push(el('span', { class: c.scriptSource ? 'badge b-hand' : 'badge b-ai', title: scripts || 'No script found' }, scriptLabel(c.scriptSource)));
  } else {
    out.push(c.script ? el('span', { class: 'badge b-single' }, 'Single-axis')
      : el('span', { class: 'badge b-ai', title: 'The scout found no script for it' }, 'No script'));
  }
  if (c.creampie) out.push(el('span', { class: 'badge b-cream' }, 'Creampie'));

  if (c.compilation) out.push(el('span', { class: 'badge b-music' }, 'Compilation'));
  return out;
}

/** Where a hand-made script for a scene is: SLR's own (hand-crafted), or an EroScripts post. */
function handLabel(h) {
  if (h.source === 'slr') return 'SLR hand-crafted script' + (h.author ? ' by ' + h.author : '');
  const kind = [h.free ? 'free' : 'paid', h.multiAxis ? 'multi-axis' : null].filter(Boolean).join(', ');
  return `EroScripts #${h.topicId} (${kind})` + (h.title ? ': ' + h.title : '');
}

// The player's script heatmap colours (renderer/js/action-graph.js speedToColor): black, blue,
// cyan, green, yellow, red; 300 position units per second and faster is red.
const HEAT_STOPS = [[0, 0, 0], [0, 0, 255], [0, 255, 255], [0, 255, 0], [255, 255, 0], [255, 0, 0]];
const HEAT_MAX = 300;
function heatColor(speed) {
  const t = Math.min(1, speed / HEAT_MAX) * (HEAT_STOPS.length - 1);
  const lo = Math.floor(t);
  const hi = Math.min(lo + 1, HEAT_STOPS.length - 1);
  const f = t - lo;
  const [r, g, b] = HEAT_STOPS[lo].map((v, i) => Math.round(v + (HEAT_STOPS[hi][i] - v) * f));
  return `rgb(${r},${g},${b})`;
}

/** The main script's speed over time, one block per bin (the post's first video). */
function heatStrip(heat) {
  if (!heat || !heat.length) return null;
  const canvas = el('canvas', { class: 'heat', width: heat.length, height: 1, title: 'Script heatmap' });
  const ctx = canvas.getContext('2d');
  heat.forEach((speed, i) => {
    if (speed <= 0) return;
    ctx.fillStyle = heatColor(speed);
    ctx.fillRect(i, 0, 1, 1);
  });
  return canvas;
}

/** A library video (Free space tab): size, score, rating, length, VR or flat, its categories. */

      tags.length ? el('div', { class: 'tags top-tags' }, tags.map((t) => el('span', { class: 'tag' }, t))) : null,
      el('div', { class: 'sect' }, 'Video'), el('dl', { class: 'facts' }, facts.flatMap(([k, v]) => [el('dt', {}, k), el('dd', {}, v)])),

const AXES = { handmade: ['Multi-axis (hand-made)', 3], generated: ['Multi-axis (generated)', 2], single: ['Single-axis', 1] };
/** "8K", "4K", "1080p" from a picture's size (VR by width, flat by height). */
function qualityLabel(q) {
  if (!q) return null;
  const k = q.width >= 7600 ? '8K' : q.width >= 5700 ? '6K' : q.width >= 3800 ? '4K' : q.height + 'p';
  return `${k} · ${q.width}×${q.height}` + (q.fps ? ` · ${Math.round(q.fps)} fps` : '');
}
/** "2 y 3 mo", "5 mo", "under a month" since an ISO time. */
function age(iso) {
  const months = Math.floor((Date.now() - new Date(iso)) / (30.44 * 864e5));
  if (!(months >= 1)) return 'under a month';
  const y = Math.floor(months / 12);
  const m = months % 12;
  return y ? `${y} y` + (m ? ` ${m} mo` : '') : `${m} mo`;
}

/**
 * A Duplicates pair: the confidence, what it rests on, and both videos with their stats
 * (score, axes, length, quality, post age, size); the better score, axes and quality in green.
 */
function pairCardNode(c, isTop) {
  const conf = Math.round(c.confidence);
  const band = conf >= 85 ? 'hi' : conf >= 65 ? 'mid' : 'lo';
  const note = c.kind === 'compilation' ? 'PMV / compilation: probably not the same video, confirm'
    : c.kind === 'versions' ? 'One VR, one flat: two versions of one scene, not the same file' : null;
  const sides = [c.left, c.right];
  const pick = (f) => {
    const [a, b] = sides.map(f);
    return a == null || b == null || a === b ? [false, false] : [a > b, b > a];
  };
  const wins = {
    score: pick((s) => s.score),
    axes: pick((s) => (AXES[s.axes] || [null, null])[1]),
    quality: pick((s) => (s.quality ? s.quality.width * s.quality.height : null)),
  };
  const sideNode = (s, i) => {
    const media = el('div', { class: 'media' });
    const imgs = [s.image, ...(s.frames || [])].filter(Boolean);
    s.shown = 0;
    if (imgs.length) {
      const img = el('img', { alt: '', draggable: 'false', decoding: 'async', src: imgs[0] });
      img.addEventListener('error', () => { media.classList.remove('loading'); media.classList.add('broken'); });
      img.addEventListener('load', () => media.classList.remove('loading', 'broken'));
      if (!img.complete) media.classList.add('loading');
      media.append(img);
      if (imgs.length > 1) media.append(el('div', { class: 'dots' }, imgs.map((_, j) => el('span', { class: j ? null : 'on' }))));
      if (isTop) preload(imgs[1]);
    } else {
      media.append(el('div', { class: 'none' }, 'No image'));
    }
    media.append(el('div', { class: 'stamp keep' }, 'KEEP'), el('div', { class: 'stamp del' }, 'DELETE'));
    const rated = s.rating > 0 ? '★'.repeat(Math.floor(s.rating)) + (s.rating % 1 ? '½' : '') : null;
    const stat = (k, v, win) => [el('dt', {}, k), el('dd', { class: win ? 'win' : null }, v)];
    const posted = s.posted ? `${age(s.posted)} (${s.postedFrom} ${day(s.posted)})` : '–';
    const file = s.path.split('/').pop();
    const stem = file.replace(/\.[^.]+$/, '');
    return el('div', { class: 'vs-side', 'data-side': i ? 'right' : 'left' },
      media,
      el('div', { class: 'ttl', title: s.path }, s.title),
      stem !== s.title ? el('div', { class: 'file', title: s.path }, file) : null,
      el('div', { class: 'by' },
        s.author ? el('span', {}, s.author) : null,
        s.library ? el('span', {}, s.library) : null,
        s.favourite ? el('span', { class: 'badge b-fav' }, '♥ favourite') : null,
        rated ? el('span', { title: 'Your rating' }, rated) : null,
        s.postUrl ? el('a', { href: s.postUrl, target: '_blank', rel: 'noopener noreferrer' }, 'post ↗') : null),
      el('dl', { class: 'vs-stats' },
        stat('Score', s.score == null ? '–' : fmt(s.score), wins.score[i]),
        stat('Axes', s.axes ? AXES[s.axes][0] : 'not checked yet', wins.axes[i]),
        stat('Length', s.runtimeMs ? clock(s.runtimeMs) : '–'),
        stat('Quality', (qualityLabel(s.quality) || '–') + (s.vr ? ' · VR' : ''), wins.quality[i]),
        stat('Age', posted),
        stat('Size', fmtBytes(s.size))));
  };
  const node = el('article', { class: 'card vs ' + (isTop ? 'top' : 'next') },
    el('div', { class: 'vs-scroll' },
      el('div', { class: 'vs-head' },
        el('div', { class: 'vs-conf' },
          el('b', { class: band }, conf + '%'),
          el('span', {}, 'duplicate confidence'),
          el('span', { class: 'vs-meter ' }, el('span', { style: `width:${conf}%;color:var(${band === 'hi' ? '--like' : band === 'mid' ? '--undo' : '--muted'})` }))),
        el('div', { class: 'vs-why' }, (c.reasons || []).join(' · ')),
        note ? el('div', { class: 'vs-note' }, note) : null),
      el('div', { class: 'vs-sides' }, sides.map(sideNode))),
    el('div', { class: 'stamp distinct' }, 'NOT DUPLICATES'));
  if (isTop) drag(node);
  return node;
}

/** Step one side of the top pair through its thumbnail and frames. */
function showSideImage(sideEl, s, delta) {
  const imgs = [s.image, ...(s.frames || [])].filter(Boolean);
  if (imgs.length < 2) return;
  s.shown = (s.shown + delta + imgs.length) % imgs.length;
  const media = sideEl.querySelector('.media');
  const img = media.querySelector('img');
  img.src = imgs[s.shown];
  media.classList.remove('broken');
  media.classList.toggle('loading', !img.complete);
  media.querySelectorAll('.dots span').forEach((d, j) => d.classList.toggle('on', j === s.shown));
  preload(imgs[(s.shown + 1) % imgs.length]);
}

/** A card's creators (`people`): a chip each, her picture and name; a tap shows her picture (see drag). */
function peopleChips(c, isTop) {

  }, el('img', { alt: '', draggable: 'false', decoding: 'async', src: p.picture }), el('span', {}, p.name))));
}

/** A card's creators' names for its facts, or null. */
function peopleNames(c) {

function cardNode(c, isTop) {
  if (isLibrary(c)) return libraryCardNode(c, isTop);
  if (isPair(c)) return pairCardNode(c, isTop);
  const imgs = c.images || [];
  const media = el('div', { class: 'media' });
  if (imgs.length) {
    const img = el('img', { alt: '', draggable: 'false', decoding: 'async', src: imgs[isTop ? image : 0] });
    img.addEventListener('error', () => { media.classList.remove('loading'); media.classList.add('broken'); });
    img.addEventListener('load', () => media.classList.remove('loading', 'broken'));
    if (!img.complete) media.classList.add('loading');
    media.append(img);
    if (imgs.length > 1) {
      media.append(el('div', { class: 'dots' }, imgs.map((_, i) => el('span', { class: i === (isTop ? image : 0) ? 'on' : null }))));
    }
  } else {
    media.append(el('div', { class: 'none' }, 'No image'));
  }
  media.append(el('div', { class: 'stamp want' }, 'WANT'), el('div', { class: 'stamp hide' }, 'HIDE'));
  const chips = peopleChips(c, isTop);
  if (chips) media.append(chips);
  const scene = isScene(c);
  // A post's creation date, or a scene's release (upload) date.
  const posted = scene ? c.date : c.created;
  const best = new Set((c.topTags || []).map((t) => t.tag));
  const tagTop = (c.topTags || []).map((t) => el('span', { class: 'tag' }, t.tag + ' ', el('b', {}, '+' + fmt(t.score))));
  const topTags = scene
    ? [...tagTop, ...(c.handmade || []).map((h) => h.source === 'eroscripts'
      ? el('a', { class: 'tag', href: 'https://discuss.eroscripts.com/t/' + h.topicId, target: '_blank', rel: 'noopener noreferrer', title: h.title || null },
        `EroScripts #${h.topicId} ` + (h.free ? 'free' : 'paid'))
      : el('span', { class: 'tag' }, 'SLR hand-crafted' + (h.author ? ' · ' + h.author : '')))]
    : tagTop;
  const node = el('article', { class: 'card ' + (isTop ? 'top' : 'next') },
    media,
    el('div', { class: 'info' },
      el('div', { class: 'badges' }, badges(c)),
      heatStrip(c.heat),
      el('div', { class: 'ttl', title: c.title || null }, c.title || '#' + c.id),
      el('div', { class: 'by' },
        c.author ? el('span', {}, (scene ? '' : 'by ') + c.author) : null,
        c.url ? el('a', { href: c.url, target: '_blank', rel: 'noopener noreferrer' }, (scene ? sourceName(c) + ' ' : '#' + c.id + ' ') + '↗') : null,
        monthYear(posted) ? el('span', { class: 'date', title: (scene ? 'Released ' : 'Posted ') + day(posted) }, monthYear(posted)) : null),
      topTags.length ? el('div', { class: 'tags top-tags' }, topTags) : null,
      scene ? sceneDetails(c, best) : details(c, best)));
  if (isTop) drag(node);
  return node;
}

/** Every tag with its tag score (best ones outlined); a null score (a scene the scout didn't score) shows the tag alone. */
function tagChips(tags, best) {
  return el('div', { class: 'tags all-tags' }, tags.map((t) => (t.score == null
    ? el('span', { class: 'tag' }, t.tag)
    : el('span', { class: best.has(t.tag) ? 'tag best' : 'tag', title: 'Tag score ' + fmt(t.score) }, t.tag + ' ',
      el('b', { class: t.score < 0 ? 'neg' : t.score > 0 ? null : 'zero' }, signed(t.score))))));
}

/** The wide layout's extra sections: every tag with its score, the post's facts, and its scenes. */
function details(c, best) {
  const out = [];
  const tags = c.tags || [];
  if (tags.length) out.push(el('div', { class: 'sect' }, 'Tags'), tagChips(tags, best));
  const facts = [
    ['Creator', c.creator],
    ['People', peopleNames(c)],
    ['Likes', c.likes],
    ['Hosts', c.hosts && c.hosts.length ? c.hosts.join(', ') : null],
    ['Size', c.gb != null ? c.gb + ' GB' : null],
    ['Created', day(c.created) || null],
    ['Last activity', day(c.bumped) || null],
  ].filter(([, v]) => v != null);
  if (facts.length) {
    out.push(el('div', { class: 'sect' }, 'Post'), el('dl', { class: 'facts' }, facts.flatMap(([k, v]) => [el('dt', {}, k), el('dd', {}, v)])));
  }
  const scenes = c.scenes || [];
  if (scenes.length) {
    const total = scenes.length + (c.moreScenes || 0);
    out.push(el('div', { class: 'sect' }, total > 1 ? `Scenes (${total})` : 'Scene'), el('ol', { class: 'scenes' },
      scenes.map((s) => el('li', {},
        el('div', { class: 'sn' }, s.name || '(unnamed)'),
        el('div', { class: 'sm' }, [
          s.host,
          s.size != null ? fmtBytes(s.size) : null,
          s.runtimeMs ? '⏱ ' + clock(s.runtimeMs) : null,
          s.axes && s.axes.length ? 'axes: ' + s.axes.join(', ') : null,
        ].filter(Boolean).join(' · ') || ' '))),
      c.moreScenes ? el('li', { class: 'sm' }, `+ ${c.moreScenes} more`) : null));
  }
  return out;
}

/** What a scene's script is: SLR's source, else stroke plus its axes, single-axis or none. */
function sceneScript(c) {
  if (c.axes && c.axes.length) return 'stroke, ' + c.axes.join(', ');
  if (c.multiAxis) return 'multi-axis';
  if (c.source === 'slr') return scriptLabel(c.scriptSource).slice('script: '.length);
  return c.script ? 'single-axis' : 'none';
}

/** The wide layout's sections for a scene: its facts, tags, the score's parts and its hand-made scripts. */
function sceneDetails(c, best) {
  const out = [];
  const facts = [
    ['Source', sourceName(c)],
    ['Script', sceneScript(c)],
    ['Performers', c.actors && c.actors.length ? c.actors.join(', ') : null],
    ['People', peopleNames(c)],
    ['Creator', c.creator],
    ['Favourite', c.favourite],
    [c.source === 'slr' || c.source === 'vrb' ? 'Studio' : 'By', c.source === 'creators' ? null : c.author],
    ['Released', c.date],
    [c.source === 'slr' ? 'Favourites' : 'Likes', c.likes],
    ['FPS', c.fps],
    ['Passthrough', c.passthrough ? 'yes' : null],
    ['Projection', c.projection],
    ['Quality', c.quality ? c.quality + 'p' : null],
    ['SLR AI script', c.aiScript ? 'yes' : null],
  ].filter(([, v]) => v != null);
  out.push(el('div', { class: 'sect' }, 'Scene'), el('dl', { class: 'facts' }, facts.flatMap(([k, v]) => [el('dt', {}, k), el('dd', {}, v)])));
  const tags = c.tags || [];
  if (tags.length) out.push(el('div', { class: 'sect' }, 'Tags'), tagChips(tags, best));
  const parts = Object.entries(c.scoreParts || {});
  if (parts.length) {
    out.push(el('div', { class: 'sect' }, 'Score'), el('div', { class: 'tags all-tags' },
      parts.map(([k, v]) => el('span', { class: 'tag' }, k + ' ', el('b', { class: v < 0 ? 'neg' : v > 0 ? null : 'zero' }, signed(v))))));
  }
  const hand = c.handmade || [];
  if (hand.length) {
    out.push(el('div', { class: 'sect' }, 'Hand-made scripts'), el('ol', { class: 'scenes' }, hand.map((h) => el('li', {},
      h.source === 'eroscripts'
        ? el('a', { class: 'sn', href: 'https://discuss.eroscripts.com/t/' + h.topicId, target: '_blank', rel: 'noopener noreferrer' }, h.title || '#' + h.topicId)
        : el('div', { class: 'sn' }, 'SLR hand-crafted script'),
      el('div', { class: 'sm' }, h.source === 'eroscripts'
        ? ['EroScripts #' + h.topicId, h.free ? 'free' : 'paid', h.multiAxis ? 'multi-axis' : null].filter(Boolean).join(' · ')
        : (h.author ? 'by ' + h.author + ' · ' : '') + 'counts against the hand-crafted script quota')))));
  }
  return out;
}

const SCOUT_NAMES = { slr: 'SLR', vrb: 'VRBangers', pmvhaven: 'PMVHaven', faptap: 'FapTap' };

/** "3 h ago" from an ISO time. */
function ago(at) {
  const hours = Math.max(0, (Date.now() - new Date(at)) / 3600e3);
  return hours < 1 ? 'under an hour ago' : hours < 48 ? `${Math.round(hours)} h ago` : `${Math.round(hours / 24)} days ago`;
}

/** When each scout last looked: the EroScripts forum scan, and each scene scout's last run. */
function renderScanned(d) {
  const s = $('scanned');
  const runs = d ? [['EroScripts', d.lastScanAt],
    ...Object.entries(d.generatedAt || {}).map(([k, at]) => [SCOUT_NAMES[k] || k, at])].filter(([, at]) => at) : [];
  if (!runs.length) { s.hidden = true; return; }
  s.textContent = 'Last scanned: ' + runs.map(([name, at]) => `${name} ${ago(at)}`).join(' · ');
  s.title = runs.map(([name, at]) => `${name}: ${new Date(at).toLocaleString()}`).join('\n');
  s.hidden = false;
}

/** The Free space and Duplicates tabs' line: each library drive's free space, what's marked, and the delete button. */
function renderDrives(d) {
  const line = $('drives');
  if (!deletes(stack) || !d) { line.hidden = true; return; }
  const parts = (d.drives || []).map((x) => [el('b', {}, fmtBytes(x.free)), ` free on ${x.mount.split('/').pop() || x.mount} (of ${fmtBytes(x.total)})`]);
  const dupes = stack === 'dupes';
  const kept = Object.entries(d.protected || {}).map(([why, n]) => `${n} ${why}`).join(', ');
  line.replaceChildren(
    ...parts.flatMap((p, i) => (i ? [' · ', ...p] : p)),
    dupes && d.bar != null ? ` · pairs at ${Math.round(d.bar)}%+ (${d.candidates} at ${Math.round(d.floorConfidence)}%+)` : '',
    el('button', { type: 'button', class: 'delete-marked', disabled: !wanted, onclick: deleteMarked,
      title: dupes ? 'Delete every copy you didn\'t keep from disk, through the app (as a duplicate: the post stays wanted)'
        : 'Delete every video marked ← from disk, through the app (as a 2★ rating does)' },
    wanted ? `Delete ${wanted} marked (${fmtBytes(markedBytes)})` : 'Nothing marked'));
  line.title = dupes
    ? `Pairs at ${Math.round(d.minConfidence)}% or more are always shown; when fewer than the target, the best ones down to ${Math.round(d.floorConfidence)}%. ${d.distinct || 0} pairs marked not duplicates.`
    : kept ? 'Never shown: ' + kept : '';
  line.hidden = false;
}

/** Free space / Duplicates: delete every marked video through the app; it removes them a moment later. */
function deleteMarked(e) {
  e.currentTarget.blur();
  const dupes = stack === 'dupes';
  const what = dupes ? `${wanted} duplicate cop${wanted === 1 ? 'y' : 'ies'}` : `${wanted} video${wanted === 1 ? '' : 's'}`;
  if (!wanted || !confirm(`Delete ${what} (${fmtBytes(markedBytes)}) from disk, with their scripts?${dupes ? ' The copies you kept stay.' : ''} This can't be undone.`)) return;
  serial(() => post(dupes ? '/api/duplicates/delete' : '/api/free-space/delete', {})).then((r) => {
    // Their marks are gone with them: undo can't bring a deleted video back.
    for (let i = undoStack.length - 1; i >= 0; i--) {
      const u = undoStack[i];
      if (dupes ? isPair(u.card) && u.dir !== 'skip' && u.dir !== 'up' : isLibrary(u.card) && u.dir === 'left') undoStack.splice(i, 1);
    }
    const left = [r.skipped.length ? `${r.skipped.length} skipped (${[...new Set(r.skipped.map((s) => s.why))].join(', ')})` : null,
      r.errors.length ? `${r.errors.length} failed: ${r.errors[0]}` : null].filter(Boolean).join(' · ');
    toast(`Deleting ${r.deleted} video${r.deleted === 1 ? '' : 's'} (${fmtBytes(r.bytes)}): the app removes them in a moment.` + (left ? ' ' + left : ''));
    restart(false);
  }).catch((err) => toast('Not deleted: ' + err.message));
}

/** The VR tab's line: the SLR account's downloads left, as slr:scout last read them (videos count for EroScripts posts on SLR too). */
function renderQuota(d) {
  const q = $('quota');
  if (stack !== 'vr' || !d) { q.hidden = true; return; }
  const left = (x) => (x && x.total != null ? el('b', {}, `${x.remaining} of ${x.total}`) : null);
  const quota = d.quota || {};
  const line = [];
  const videos = left(quota.videos);
  if (videos) line.push('SLR videos left ', videos, ' (7 days)');
  const scripts = [[left(quota.scripts), ' hand-crafted'], [left(quota.aiScripts), ' AI']].filter(([b]) => b);
  if (scripts.length) {
    line.push(line.length ? ' · scripts this month ' : 'SLR scripts this month ', ...scripts.flatMap(([b, what], i) => (i ? [' · ', b, what] : [b, what])));
  }
  if (line.length) {
    if (quota.checkedAt) line.push(` · checked ${day(quota.checkedAt)}`);
  } else if (!(d.generatedAt && d.generatedAt.slr)) {
    line.push('No slr:scout run yet: npm run slr:scout');
  } else {
    line.push('SLR quota not read yet');
  }
  if (d.quotaError) {
    const login = /session/i.test(d.quotaError) ? ': npm run slr:scout -- --login' : '';
    line.push(' ', el('span', { class: 'err' }, `(${d.quotaError}${login})`));
  }
  q.replaceChildren(...line);
  q.hidden = false;
}

const preloaded = new Set();
function preload(url) {
  if (!url || preloaded.has(url)) return;
  preloaded.add(url);
  new Image().src = url;
}

/** "19.0 GB", "1,953 GB" (10^9 bytes). */
const gb = (b) => (b >= 100e9 ? Math.round(b / 1e9).toLocaleString('en-US') : (b / 1e9).toFixed(1)) + ' GB';
const fullMessage = () => `Library drive full (${gb(drive.drive.free)} free): swiping is off until ${gb(drive.minFreeBytes)} is free. The Free space tab deletes videos.`;

/** The drive bar: free space in GB, a meter of the used part with a mark where swiping stops. */
function renderDrive() {
  const box = $('drive');
  if (!drive) { box.hidden = true; return; }
  const d = drive.drive;
  const min = drive.minFreeBytes;
  box.hidden = false;
  box.classList.toggle('full', driveFull());
  box.classList.toggle('low', !driveFull() && Boolean(d && min != null && d.free < 2 * min));
  $('drive-meter').hidden = !d;
  if (!d) {
    box.title = '';
    $('drive-line').replaceChildren(el('span', {}, 'Library drive: ', el('span', { class: 'err' }, (drive.problems || []).join('; ') || 'not measured')));
    return;
  }
  box.title = `${d.mount}: ${d.free.toLocaleString('en-US')} bytes free of ${d.total.toLocaleString('en-US')}`;
  const used = d.total ? (d.total - d.free) / d.total : 0;
  $('drive-used').style.width = (used * 100).toFixed(2) + '%';
  $('drive-limit').hidden = min == null || !d.total;
  if (min != null && d.total) $('drive-limit').style.left = (Math.max(0, d.total - min) / d.total * 100).toFixed(2) + '%';
  $('drive-line').replaceChildren(
    el('span', {}, driveFull() ? 'Drive full: ' : 'Library drive: ', el('b', {}, gb(d.free) + ' free'), ` of ${gb(d.total)}`),
    min == null ? '' : el('span', {}, driveFull() ? `swiping is off until ${gb(min)} is free (Free space still works)` : `swiping stops under ${gb(min)}`));
}

async function loadDrive() {
  try {
    const res = await fetch('/api/drive', { cache: 'no-store' });
    if (!res.ok) throw new Error((await res.text()).trim() || res.status);
    drive = await res.json();
  } catch (e) {
    drive = { drive: null, minFreeBytes: null, full: false, problems: ['could not read the drive: ' + e.message] };
  }
  renderDrive();
  renderCounter();
}

function renderCounter() {
  const marked = deletes(stack) ? ` · ${wanted} marked · ${fmtBytes(markedBytes)}` : ` · ${wanted} wanted`;
  $('counter').textContent = loaded ? `${remaining}${stack === 'dupes' ? ' pairs' : ''} left${marked}` : 'Loading…';
  $('undo').disabled = !undoStack.length;
  $('skip').disabled = !queue.length;
  $('nope').disabled = $('like').disabled = $('distinct').disabled = !queue.length || swipeBlocked();
  const free = stack === 'free';
  const dupes = stack === 'dupes';
  $('like').title = swipeBlocked() ? fullMessage() : dupes ? 'Keep the right video, delete the left one (→); nothing is deleted until Delete marked'
    : free ? 'Keep: never offered again (→)' : 'Want: its scout downloads it (→)';
  $('nope').title = swipeBlocked() ? fullMessage() : dupes ? 'Keep the left video, delete the right one (←); nothing is deleted until Delete marked'
    : free ? 'Mark for deletion (←); nothing is deleted until Delete marked' : 'Hide from the deck (←)';
  if (deletes(stack) && lastDeck) renderDrives(lastDeck);
}

/** Redraw the top two cards (a card flying off stays until its animation ends). */
function render(enterFrom) {
  for (const n of deckEl.querySelectorAll('.card:not(.fly)')) n.remove();
  renderCounter();
  const empty = $('empty');
  if (!queue.length) {
    empty.hidden = false;
    empty.replaceChildren(...(loadError ? ['Could not load the deck: ' + loadError, el('button', { type: 'button', class: 'round small', onclick: reload, title: 'Retry' }, '⟳')]
      : loading ? ['Loading…']
      : stack === 'free' ? ['Nothing left to offer on Free space.',
        el('span', {}, wanted ? 'Delete the marked videos above, or undo a swipe.' : 'Everything else is protected (hover the drive line to see why).'),
        el('a', { href: '/' }, 'Back to the report')]
      : stack === 'dupes' ? ['No likely duplicates left.',
        el('span', {}, (wanted ? 'Delete the marked copies above, or undo a swipe. ' : '')
          + (lastDeck ? `Pairs under ${Math.round(lastDeck.floorConfidence)}% confidence aren't shown.` : '')),
        el('span', {}, 'npm run dedupe:scenes measures frames of same-length videos, which makes the confidence surer.')]
      : [`Nothing left to swipe on ${STACK_NAMES[stack]}.`,
        el('span', {}, TAB_SCOUTS[stack].map((s) => 'npm run ' + s).join(', ') + ' find more.')]));
    return;
  }
  empty.hidden = true;
  if (queue[1]) deckEl.append(cardNode(queue[1], false));
  const top = cardNode(queue[0], true);
  if (enterFrom) {
    top.classList.add('drag');
    top.style.transform = enterFrom === 'skip' || enterFrom === 'up' ? 'translateY(-120%)'
      : `translateX(${enterFrom === 'right' ? '' : '-'}120%) rotate(${enterFrom === 'right' ? 20 : -20}deg)`;
  }
  deckEl.append(top);
  if (enterFrom) {
    requestAnimationFrame(() => requestAnimationFrame(() => {
      top.classList.remove('drag');
      top.style.transform = '';
    }));
  }
  // Only what's shown next: the top card's next image and the next card's first. Forum GIFs run
  // 3–7 MB each, so loading every image of a card up front made swiping lag on a phone.
  preload((queue[0].images || [])[image + 1]);
  if (queue[1]) preload((queue[1].images || [])[0]);
}

function topNode() {
  return deckEl.querySelector('.card.top:not(.fly)');
}

function showImage(i) {
  const c = queue[0];
  const imgs = (c && c.images) || [];
  if (imgs.length < 2) return;
  image = (i + imgs.length) % imgs.length;
  const node = topNode();
  if (!node) return;
  const media = node.querySelector('.media');
  const img = media.querySelector(':scope > img');
  img.src = imgs[image];
  media.classList.remove('broken');
  media.classList.toggle('loading', !img.complete);
  node.querySelectorAll('.dots span').forEach((d, j) => d.classList.toggle('on', j === image));
  node.querySelectorAll('.person').forEach((p) => p.classList.toggle('on', Number(p.dataset.image) === image));
  preload(imgs[(image + 1) % imgs.length]);
}

function threshold() {
  return Math.min(140, deckEl.clientWidth * 0.28);
}

/** The drag's stamps: `t` -1 … 1 sideways (left / right), `up` 0 … 1 (Duplicates: not duplicates). */
function setStamps(node, t, up) {
  if (node.classList.contains('vs')) {
    const [l, r] = ['left', 'right'].map((s) => node.querySelector(`.vs-side[data-side="${s}"]`));
    l.querySelector('.stamp.keep').style.opacity = Math.max(0, -t);
    l.querySelector('.stamp.del').style.opacity = Math.max(0, t);
    r.querySelector('.stamp.keep').style.opacity = Math.max(0, t);
    r.querySelector('.stamp.del').style.opacity = Math.max(0, -t);
    node.querySelector('.stamp.distinct').style.opacity = Math.max(0, up || 0);
    return;
  }
  node.querySelector('.stamp.want').style.opacity = Math.max(0, t);
  node.querySelector('.stamp.hide').style.opacity = Math.max(0, -t);
}

/** Pointer drag with tilt; past the threshold it commits, a tap browses the gallery (a tap on a creator's chip shows
 *  her picture; a drag from it still drags the card). */
function drag(node) {
  let start = null;
  let dx = 0;
  let dy = 0;
  let moved = false;
  let chip = null;
  node.addEventListener('pointerdown', (e) => {
    if (e.button !== 0 || e.target.closest('a, button')) return;
    // The side panel's scrollbar scrolls, it doesn't drag.
    const panel = e.target.closest('.info, .vs-scroll');
    if (panel && e.clientX >= panel.getBoundingClientRect().left + panel.clientLeft + panel.clientWidth) return;
    start = { x: e.clientX, y: e.clientY };
    dx = dy = 0;
    moved = false;
    // The card takes the pointer capture (so the tap's own click lands on the card): remember the chip pressed.
    chip = e.target.closest('.person');
    node.setPointerCapture(e.pointerId);
    node.classList.add('drag');
  });
  node.addEventListener('pointermove', (e) => {
    if (!start) return;
    dx = e.clientX - start.x;
    dy = e.clientY - start.y;
    if (!moved && Math.hypot(dx, dy) < 8) return;
    // A pair card scrolls on touch: a mostly vertical finger is the scroll's, not a drag
    // (↑ not duplicates stays on the button and the key there).
    if (!moved && e.pointerType === 'touch' && node.classList.contains('vs') && Math.abs(dy) > Math.abs(dx)) {
      start = null;
      node.classList.remove('drag');
      if (node.hasPointerCapture(e.pointerId)) node.releasePointerCapture(e.pointerId);
      return;
    }
    moved = true;
    const pair = node.classList.contains('vs');
    node.style.transform = `translate(${dx}px, ${dy * (pair ? 0.6 : 0.3)}px) rotate(${dx * 0.06}deg)`;
    const up = pair && -dy > Math.abs(dx) ? Math.min(1, -dy / threshold()) : 0;
    setStamps(node, up ? 0 : Math.max(-1, Math.min(1, dx / threshold())), up);
  });
  const end = (e) => {
    if (!start) return;
    start = null;
    node.classList.remove('drag');
    if (!moved) {
      // The card holds the pointer capture, so locate the tap by its coordinates.
      if (e.type !== 'pointerup') return;
      // A creator's chip: her picture, not the side-tap's next or previous one.
      if (chip) {
        const i = Number(chip.dataset.image);
        if (i >= 0) showImage(i);
        return;
      }
      const inside = (r) => e.clientY >= r.top && e.clientY <= r.bottom && e.clientX >= r.left && e.clientX <= r.right;
      if (node.classList.contains('vs')) {
        // Each side steps through its own thumbnail and frames.
        for (const sideEl of node.querySelectorAll('.vs-side')) {
          const r = sideEl.querySelector('.media').getBoundingClientRect();
          const s = sideEl.dataset.side === 'left' ? queue[0].left : queue[0].right;
          if (inside(r)) showSideImage(sideEl, s, e.clientX < r.left + r.width / 2 ? -1 : 1);
        }
        return;
      }
      const r = node.querySelector('.media').getBoundingClientRect();
      if (inside(r)) showImage(image + (e.clientX < r.left + r.width / 2 ? -1 : 1));
      return;
    }
    if (Math.abs(dx) > threshold() && Math.abs(dx) >= -dy) {
      swipe(dx > 0 ? 'right' : 'left', dy * 0.3);
    } else if (-dy > threshold()) {
      // Duplicates: up is "not duplicates"; elsewhere it skips.
      if (node.classList.contains('vs')) swipe('up'); else skip();
    } else {
      node.style.transform = '';
      setStamps(node, 0, 0);
    }
  };
  node.addEventListener('pointerup', end);
  node.addEventListener('pointercancel', end);
}

function fly(node, dir, dy) {
  node.classList.remove('drag');
  node.classList.add('fly');
  if (dir === 'skip' || dir === 'up') {
    if (dir === 'up') setStamps(node, 0, 1);
    node.style.transform = `translateY(${-1.2 * window.innerHeight}px)`;
  } else {
    const sign = dir === 'right' ? 1 : -1;
    setStamps(node, sign, 0);
    node.style.transform = `translate(${sign * 1.4 * window.innerWidth}px, ${dy || 0}px) rotate(${sign * 30}deg)`;
  }
  setTimeout(() => node.remove(), 400);
}

/** Change the counters; a deck request in flight hears of it too. */
function count(dRemaining, dWanted, dBytes) {
  remaining = Math.max(0, remaining + dRemaining);
  wanted = Math.max(0, wanted + dWanted);
  markedBytes = Math.max(0, markedBytes + (dBytes || 0));
  if (since) {
    since.remaining += dRemaining;
    since.wanted += dWanted;
    since.bytes += dBytes || 0;
  }
}

/** The video a Duplicates swipe deletes: left keeps the left one. */
const doomedSide = (card, dir) => (dir === 'left' ? card.right : dir === 'right' ? card.left : null);

/** A swipe's change to the counters (Free space's and Duplicates' marked bytes too); `sign` -1 takes it back. */
function swipeCount(card, dir, sign) {
  const m = marks(card, dir);
  const bytes = !m ? 0 : isLibrary(card) ? card.size || 0 : isPair(card) ? doomedSide(card, dir).size || 0 : 0;
  count(-sign, m ? sign : 0, sign * bytes);
}

function swipe(dir, dy) {
  const card = queue[0];
  if (!card) return;
  if (swipeBlocked()) {
    // The download tabs are off while the drive is full: a dragged card springs back.
    const node = topNode();
    if (node) { node.style.transform = ''; setStamps(node, 0, 0); }
    toast(fullMessage());
    return;
  }
  const node = topNode();
  if (node) fly(node, dir, dy);
  queue.shift();
  // Duplicates: the deleted video's other pairs leave the deck with it (back on undo).
  const doomed = isPair(card) ? doomedSide(card, dir) : null;
  const dropped = doomed ? queue.filter((c) => isPair(c) && (c.left.id === doomed.id || c.right.id === doomed.id)) : [];
  if (dropped.length) {
    queue = queue.filter((c) => !dropped.includes(c));
    count(-dropped.length, 0, 0);
  }
  undoStack.push({ card, dir, stack, dropped });
  swipeCount(card, dir, 1);
  image = 0;
  render();
  const from = stack;
  // Each card's own endpoint: a post to /api/swipe, a scene to /api/scenes/<source>/swipe.
  serial(() => post(swipePath(card), { id: card.id, dir })).catch((e) => {
    // Not saved: put the card back on top (unless the page moved to another tab meanwhile).
    // 507: the drive filled up since the bar last looked; reread it, which turns swiping off.
    if (e.status === 507) loadDrive();
    const i = undoStack.findIndex((u) => u.card === card);
    if (i >= 0) undoStack.splice(i, 1);
    if (stack !== from) { toast('Swipe not saved: ' + e.message); return; }
    if (!queue.some((c) => keyOf(c) === keyOf(card))) queue.unshift(card, ...dropped);
    if (dropped.length) count(dropped.length, 0, 0);
    swipeCount(card, dir, -1);
    image = 0;
    render();
    toast('Swipe not saved: ' + e.message);
  });
  if (queue.length <= REFILL_AT) more();
}

/** Put the top card aside; it goes back into the deck a few cards on (returnSkipped). Nothing is saved. */
function skip() {
  const card = queue[0];
  if (!card) return;
  const node = topNode();
  if (node) fly(node, 'skip');
  queue.shift();
  undoStack.push({ card, dir: 'skip', stack });
  skipped.push(card);
  image = 0;
  if (queue.length <= REFILL_AT) {
    if (exhausted) returnSkipped(); else more();
  }
  render();
}

/**
 * Shuffle the skipped cards back into the deck, each at a random place after the next
 * REFILL_AT cards (or anywhere when fewer are left), so they come back later, not at once.
 */
function returnSkipped() {
  for (const card of skipped) {
    const from = Math.min(REFILL_AT, queue.length);
    queue.splice(from + Math.floor(Math.random() * (queue.length - from + 1)), 0, card);
  }
  skipped = [];
}

function undo() {
  const last = undoStack.pop();
  if (!last) return;
  if (last.stack !== stack) {
    // Made on another tab: forget it there; this tab's cards and counters stay.
    if (last.dir === 'skip') return;
    serial(() => post(swipePath(last.card) + '/undo', { id: last.card.id }))
      .then(() => toast(`Undone on the ${STACK_NAMES[last.stack]} tab: ${last.card.title || '#' + last.card.id}`))
      .catch((e) => { undoStack.push(last); toast('Undo not saved: ' + e.message); });
    renderCounter();
    return;
  }
  queue = queue.filter((c) => keyOf(c) !== keyOf(last.card));
  queue.unshift(last.card);
  const dropped = last.dropped || [];
  if (dropped.length) {
    queue.splice(1, 0, ...dropped.filter((c) => !queue.some((q) => keyOf(q) === keyOf(c))));
    count(dropped.length, 0, 0);
  }
  image = 0;
  if (last.dir === 'skip') {
    skipped = skipped.filter((c) => keyOf(c) !== keyOf(last.card));
    render('skip');
    return;
  }
  swipeCount(last.card, last.dir, -1);
  render(last.dir);
  serial(() => post(swipePath(last.card) + '/undo', { id: last.card.id })).catch((e) => {
    // The swipe still stands: take the card off again.
    queue = queue.filter((c) => keyOf(c) !== keyOf(last.card) && !dropped.includes(c));
    if (dropped.length) count(-dropped.length, 0, 0);
    undoStack.push(last);
    swipeCount(last.card, last.dir, 1);
    image = 0;
    render();
    toast('Undo not saved: ' + e.message);
  });
}

/**
 * Fetch the next cards in this deal's order (seed). The server leaves out everything swiped
 * so far and the cards this page holds (on screen or skipped); skipped ones then go back in.
 */
function more() {
  if (loading || exhausted) return;
  loading = true;
  since = { remaining: 0, wanted: 0, bytes: 0 };
  const gen = generation;
  // The cards this page holds (on screen or skipped), as <source>:<id>: the server leaves them out.
  const held = [...queue, ...skipped].map(keyOf).join(',');
  serial(async () => {
    const jitter = jitters[stack] == null ? '' : `&jitter=${jitters[stack]}`;
    const res = await fetch(`/api/deck?stack=${stack}&limit=${BATCH}&seed=${seed}${jitter}&exclude=${held}`, { cache: 'no-store' });
    if (!res.ok) throw new Error((await res.text()).trim() || res.status);
    return res.json();
  }).then((d) => {
    if (gen !== generation) return; // dealt before a refresh or shuffle
    loadError = null;
    // The server answered before the swipes made since the request: count them on top.
    remaining = Math.max(0, d.remaining + since.remaining);
    wanted = Math.max(0, d.wanted + since.wanted);
    markedBytes = Math.max(0, (d.markedBytes || 0) + since.bytes);
    since = null;
    lastDeck = d;
    // Free space: thumbnails come from the app's backend, on the host this page was reached on.
    if (d.backendPort) backendPort = d.backendPort;
    for (const c of d.cards) {
      if (isLibrary(c)) c.images = c.thumb && backendPort ? [`${location.protocol}//${location.hostname}:${backendPort}${c.thumb}`] : [];
      if (isPair(c)) {
        for (const s of [c.left, c.right]) s.image = s.thumb && backendPort ? `${location.protocol}//${location.hostname}:${backendPort}${s.thumb}` : null;
      }
    }
    exhausted = d.cards.length < BATCH;
    // Swiped cards (a swipe still on its way to the server) don't come back; skipped ones may.
    const swiped = undoStack.filter((u) => u.dir !== 'skip' && u.stack === stack).map((u) => u.card);
    const have = new Set([...queue, ...skipped, ...swiped].map(keyOf));
    const fresh = d.cards.filter((c) => !have.has(keyOf(c)));
    const wasEmpty = !queue.length;
    queue.push(...fresh);
    returnSkipped();
    $('problems').hidden = !d.problems.length;
    $('problems').textContent = d.problems.join('\n');
    renderQuota(d);
    renderScanned(d);
    renderDrives(d);
    loading = false;
    if (wasEmpty) image = 0;
    loaded = true;
    if (wasEmpty) {
      render();
    } else {
      // Keep the top card (and a drag in progress); add the card under it if it was missing.
      if (queue[1] && !deckEl.querySelector('.card.next:not(.fly)')) {
        deckEl.append(cardNode(queue[1], false));
        preload((queue[1].images || [])[0]);
      }
      renderCounter();
    }
  }).catch((e) => {
    if (gen !== generation) return;
    loading = false;
    since = null;
    loadError = e.message;
    if (!queue.length) {
      returnSkipped();
      render();
    }
    if (queue.length) toast('Could not load more cards: ' + e.message);
  });
}

function reload() {
  exhausted = false;
  loadError = null;
  more();
  render();
}

/**
 * Deal the deck again from the server (new images, runtimes and heat strips the scout saved since,
 * skipped cards back in their place); `newOrder` also picks a new seed. Undo keeps working.
 */
function restart(newOrder) {
  generation++;
  if (newOrder) seed = newSeed();
  queue = [];
  skipped = [];
  image = 0;
  loading = false;
  since = null;
  reload();
}

$('refresh').addEventListener('click', (e) => { e.currentTarget.blur(); loadDrive(); restart(false); });
$('shuffle').addEventListener('click', (e) => { e.currentTarget.blur(); restart(true); });

// Each tab's buttons and keys: Free space marks library videos for deletion (←) or keeps them (→);
// Duplicates keeps the left (←) or right (→) video of a pair, ↑ says they aren't duplicates.
const HINTS = {
  deck: '← hide · → want · ↓ or drag up skip · Backspace undo · Space next image · tap the image\'s sides to browse',
  free: '← mark for deletion · → keep · ↓ or drag up skip · Backspace undo · Delete marked (above the card) deletes them',
  dupes: '← keep left · → keep right · ↑ or drag up not duplicates · ↓ skip · Backspace undo · Delete marked (above the card) deletes the other copies',
};
function showStack() {
  for (const b of $('stacks').querySelectorAll('button')) b.classList.toggle('on', b.dataset.stack === stack);
  $('hint').textContent = HINTS[deletes(stack) ? stack : 'deck'];
  const dupes = stack === 'dupes';
  $('distinct').hidden = !dupes;
  $('nope').textContent = dupes ? '◀' : '✕';
  $('like').textContent = dupes ? '▶' : '♥';
  $('nope').setAttribute('aria-label', dupes ? 'Keep left' : 'Hide');
  $('like').setAttribute('aria-label', dupes ? 'Keep right' : 'Want');
  if (stack !== 'vr') renderQuota(null);
  renderScanned(null);
  lastDeck = null;
  renderDrives(null);
}
$('stacks').addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  b.blur();
  if (b.dataset.stack === stack) return;
  stack = b.dataset.stack;
  localStorage.setItem('swipeStack', stack);
  showStack();
  restart(false);
});
showStack();

/** ⚙: one shuffle amplitude per stack; a change to the dealt stack's re-deals it in the same seed. */
function showJitters() {
  for (const k of Object.keys(JITTER_DEFAULT)) {
    const input = $('jitter-' + k);
    input.placeholder = String(JITTER_DEFAULT[k]);
    input.value = jitters[k] == null ? '' : String(jitters[k]);
  }
}
function setJitters(next) {
  const before = jitters[stack];
  jitters = next;
  localStorage.setItem('swipeJitter', JSON.stringify(jitters));
  showJitters();
  if (jitters[stack] !== before) restart(false);
}
function toggleSettings(open) {
  $('settings').hidden = !open;
  $('gear').setAttribute('aria-expanded', String(open));
  if (open) showJitters();
}
$('gear').addEventListener('click', (e) => { e.currentTarget.blur(); toggleSettings($('settings').hidden); });
$('settings').addEventListener('change', (e) => {
  const input = e.target.closest('input');
  if (!input) return;
  const next = { ...jitters };
  if (input.value === '' && !input.validity.badInput) {
    delete next[input.dataset.stack];
  } else {
    const n = Number(input.value);
    if (input.validity.badInput || !Number.isFinite(n)) { showJitters(); return; }
    next[input.dataset.stack] = Math.min(JITTER_MAX, Math.max(0, n));
  }
  setJitters(next);
});
$('jitter-reset').addEventListener('click', (e) => { e.currentTarget.blur(); setJitters({}); });
document.addEventListener('pointerdown', (e) => {
  if (!$('settings').hidden && !e.target.closest('#settings, #gear')) toggleSettings(false);
});
showJitters();

// Buttons drop focus so Space keeps meaning "next image".
$('nope').addEventListener('click', (e) => { e.currentTarget.blur(); swipe('left'); });
$('like').addEventListener('click', (e) => { e.currentTarget.blur(); swipe('right'); });
$('undo').addEventListener('click', (e) => { e.currentTarget.blur(); undo(); });
$('skip').addEventListener('click', (e) => { e.currentTarget.blur(); skip(); });
$('distinct').addEventListener('click', (e) => { e.currentTarget.blur(); swipe('up'); });
document.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'Escape' && !$('settings').hidden) { toggleSettings(false); return; }
  // Typing in the ⚙ panel's fields: keys are theirs.
  if (e.target.closest && e.target.closest('input, select, textarea')) return;
  if (e.key === 'ArrowLeft') swipe('left');
  else if (e.key === 'ArrowRight') swipe('right');
  else if (e.key === 'ArrowUp' && stack === 'dupes') swipe('up');
  else if (e.key === 'ArrowDown') skip();
  else if (e.key === 'Backspace') undo();
  else if (e.key === ' ') showImage(image + 1);
  else return;
  e.preventDefault();
});

loadDrive();
setInterval(loadDrive, 60e3);
document.addEventListener('visibilitychange', () => { if (!document.hidden) loadDrive(); });
reload();
</script>
</body>
</html>
