<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>FunSync</title>
<style>
  :root { --bg: #111318; --fg: #e8e8ea; --muted: #9a9ca3; --card: #1c1f26; --line: #2c3039; --accent: #4f8cff; --bad: #ff6b6b; }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f4f5f7; --fg: #16181d; --muted: #5d6068; --card: #fff; --line: #d5d8de; --accent: #2563eb; --bad: #c62828; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
    background: var(--bg); color: var(--fg); font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  form { width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 14px; padding: 24px;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
  h1 { margin: 0; font-size: 22px; }
  p { margin: 0; color: var(--muted); font-size: 14px; }
  p.error { color: var(--bad); font-weight: 600; }
  input { width: 100%; padding: 12px; font-size: 28px; letter-spacing: .3em; text-align: center;
    color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; }
  input:focus { outline: 2px solid var(--accent); border-color: transparent; }
  button { padding: 12px; font-size: 18px; color: #fff; background: var(--accent); border: 0; border-radius: 10px; cursor: pointer; }
</style>
</head>
<body>
<form method="post" action="login">
  <h1>FunSync</h1>
  <p>Enter the access PIN to continue.</p>
  {{MESSAGE}}
  <input type="password" name="pin" inputmode="numeric" pattern="[0-9]*" minlength="4" maxlength="12"
    autocomplete="current-password" aria-label="PIN" required autofocus>
  <input type="hidden" name="next" value="{{NEXT}}">
  <button type="submit">Unlock</button>
</form>
</body>
</html>
