<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17181b" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='1.5' width='24' height='29' rx='5' fill='%23e0529c'/%3E%3Cpath d='M16 25.5C8.5 20.4 6.5 16.6 6.5 13.4 6.5 10.6 8.7 8.5 11.3 8.5c2 0 3.6 1.1 4.7 2.8 1.1-1.7 2.7-2.8 4.7-2.8 2.6 0 4.8 2.1 4.8 4.9 0 3.2-2 7-9.5 12.1z' fill='%23fff'/%3E%3C/svg%3E">
<title>Content creators</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #fafafa; --fg: #1d1d1f; --muted: #6b6b70; --line: #d9d9de; --panel: #ffffff;
  --accent: #2f6fdf; --row: #f2f2f5; --warn-bg: #fff4d6; --warn-fg: #6b4e00;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #17181b; --fg: #e6e6e9; --muted: #9a9aa3; --line: #34353b; --panel: #1f2024;
    --accent: #7aa7ff; --row: #232429; --warn-bg: #3d3214; --warn-fg: #ffd98a;
  }
}
* { box-sizing: border-box; }
body { margin: 0; padding: 16px 20px 40px; background: var(--bg); color: var(--fg);
  font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
h1 { font-size: 20px; margin: 0 0 4px; }
h1 .nav { font-size: 14px; font-weight: 400; margin-left: 10px; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.muted { color: var(--muted); }
.meta { color: var(--muted); margin-bottom: 12px; }
.problems { background: var(--warn-bg); color: var(--warn-fg); padding: 8px 12px;
  border-radius: 6px; margin-bottom: 12px; white-space: pre-wrap; }
.filters { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; margin-bottom: 12px; }
.filters label { display: flex; align-items: center; gap: 6px; }
.count { color: var(--muted); }
table { border-collapse: collapse; }
.creators { width: 100%; }
.creators th { position: sticky; top: 0; background: var(--bg); text-align: left; padding: 6px 8px;
  border-bottom: 2px solid var(--line); white-space: nowrap; font-size: 12px; color: var(--muted);
  cursor: pointer; user-select: none; }
.creators th:hover { color: var(--fg); }
.creators th .arrow { display: inline-block; width: 1em; }
.creators td { padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.creators tbody tr:nth-child(even) { background: var(--row); }
.num { white-space: nowrap; font-variant-numeric: tabular-nums; }
.name { font-weight: 600; white-space: nowrap; }
.unsure { color: #d08b2c; cursor: help; font-weight: 600; margin-left: 2px; }
.small { color: var(--muted); font-size: 12px; }
details summary { cursor: pointer; }
details ul { margin: 4px 0 0; padding-left: 18px; font-size: 13px; }
details li { margin-bottom: 3px; }
.badge { display: inline-block; padding: 0 6px; margin-left: 4px; border-radius: 999px; font-size: 11px;
  white-space: nowrap; border: 1px solid var(--bc, #888);
  background: color-mix(in srgb, var(--bc, #888) 18%, transparent); }
.b-free { --bc: #3aa655; } .b-paid { --bc: #d08b2c; } .b-multi { --bc: #3b82f6; }
.b-creampie { --bc: #e0529c; } .b-lib { --bc: #14b8a6; } .b-dl { --bc: #3aa655; } .b-nodl { --bc: #8b8b93; }
.empty { padding: 24px; text-align: center; color: var(--muted); }
.empty code { font-size: 13px; }

/* Phones: rows become cards with labelled cells. */
@media (max-width: 760px) {
  body { padding: 10px 10px 32px; font-size: 15px; }
  h1 { font-size: 18px; }
  .creators thead { display: none; }
  .creators, .creators tbody { display: block; }
  .creators tbody tr { display: flex; flex-wrap: wrap; gap: 4px 14px; padding: 10px 0;
    border-bottom: 1px solid var(--line); background: none; }
  .creators tbody tr:nth-child(even) { background: none; }
  .creators td { display: block; border: none; padding: 0; }
  .creators td.name { flex: 1 1 100%; font-size: 16px; }
  .creators td.wide { flex: 1 1 100%; }
  .creators td[data-label]::before { content: attr(data-label) ' '; color: var(--muted); font-size: 12px; }
  .creators td.empty { flex-basis: 100%; }
  input, button { min-height: 38px; font-size: 16px; }
}
</style>
</head>
<body>
<h1>Content creators <a class="nav" href="/">Report</a><a class="nav" href="/swipe">Swipe</a></h1>
<div class="meta" id="meta">Loading…</div>
<div class="problems" id="problems" hidden></div>
<div class="filters">
  <label><input type="checkbox" id="dl-only" checked> Downloadable only</label>
  <span class="count" id="count"></span>
</div>
<table class="creators">
  <thead><tr id="head">
    <th data-key="name">Creator<span class="arrow"></span></th>
    <th data-key="instagram">Instagram<span class="arrow"></span></th>
    <th data-key="twitch">Twitch<span class="arrow"></span></th>
    <th data-key="eroscripts">EroScripts<span class="arrow"></span></th>
    <th data-key="faptap">FapTap<span class="arrow"></span></th>
    <th data-key="score">Score<span class="arrow"></span></th>
  </tr></thead>
  <tbody id="rows"></tbody>
</table>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let creators = [];
let missing = null;
let sort = { key: 'score', desc: true };

// "5M", "12.3K", "1,234" or a number → a number, for sorting.
function count(v) {
  if (typeof v === 'number') return v;
  const m = /^([\d.,]+)\s*([KMB])?$/i.exec(String(v ?? '').trim());
  if (!m) return -1;
  const n = parseFloat(m[1].replace(/,/g, ''));
  return n * ({ K: 1e3, M: 1e6, B: 1e9 }[(m[2] || '').toUpperCase()] || 1);
}
const fmtCount = (v) => typeof v === 'number' ? v.toLocaleString() : esc(v ?? '');
const unsure = (acc) => acc && acc.match === 'medium'
  ? '<span class="unsure" title="Medium-confidence match: may be a different person">?</span>' : '';
const downloadable = (c) => (c.eroscripts || []).filter((p) => p.downloadable).length;
const keep = (c) => !$('dl-only').checked || downloadable(c) > 0 || (c.faptap || []).length > 0;

const sortValue = {
  name: (c) => (c.name || '').toLowerCase(),
  instagram: (c) => c.instagram ? count(c.instagram.followers) : -2,
  twitch: (c) => c.twitch ? count(c.twitch.followers) : -2,
  eroscripts: (c) => downloadable(c) * 1e4 + (c.eroscripts || []).length,
  faptap: (c) => (c.faptap || []).length,
  score: (c) => typeof c.score === 'number' ? c.score : -Infinity,
};

function instagramCell(ig) {
  if (!ig || !ig.handle) return '—';
  const h = encodeURIComponent(ig.handle);
  let s = `<a href="https://www.instagram.com/${h}/" target="_blank" rel="noopener">@${esc(ig.handle)}</a>${unsure(ig)}`;
  if (ig.followers != null) s += `<div class="small">${fmtCount(ig.followers)} followers</div>`;
  return s;
}

function twitchCell(tw) {
  if (!tw || !tw.handle) return '—';
  const h = encodeURIComponent(tw.handle);
  let s = `<a href="https://www.twitch.tv/${h}" target="_blank" rel="noopener">${esc(tw.handle)}</a>${unsure(tw)}`;
  if (tw.followers != null) s += `<div class="small">${fmtCount(tw.followers)} followers</div>`;
  const live = tw.lastLive ? new Date(tw.lastLive) : null;
  s += `<div class="small">last live ${live && !isNaN(live) ? live.toISOString().slice(0, 10) : '—'}</div>`;
  return s;
}

function postItem(p) {
  const badges = [
    p.free === true ? '<span class="badge b-free">free</span>' : p.free === false ? '<span class="badge b-paid">paid</span>' : '',
    p.downloadable ? '<span class="badge b-dl">downloadable</span>' : '<span class="badge b-nodl">no download</span>',
    p.multiAxis ? '<span class="badge b-multi">multi-axis</span>' : '',
    p.creampie ? '<span class="badge b-creampie">creampie</span>' : '',
    p.inLibrary ? '<span class="badge b-lib">in library</span>' : '',
  ].join('');
  const score = typeof p.score === 'number' ? ` <span class="small">${p.score.toFixed(1)}</span>` : '';
  const hosts = (p.hosts || []).length ? `<div class="small">${p.hosts.map(esc).join(', ')}</div>` : '';
  return `<li><a href="https://discuss.eroscripts.com/t/${encodeURIComponent(p.id)}" target="_blank" rel="noopener">${esc(p.title || `#${p.id}`)}</a>${score}${badges}${hosts}</li>`;
}

function eroscriptsCell(c) {
  const posts = c.eroscripts || [];
  if (!posts.length) return '—';
  return `<details><summary>${downloadable(c)}/${posts.length}</summary><ul>${posts.map(postItem).join('')}</ul></details>`;
}

function faptapCell(c) {
  const vids = c.faptap || [];
  if (!vids.length) return '—';
  const items = vids.map((v) => {
    const url = /^https:\/\//.test(v.url || '') ? v.url : `https://faptap.net/v/${encodeURIComponent(v.id)}`;
    return `<li><a href="${esc(url)}" target="_blank" rel="noopener">${esc(v.title || v.id)}</a></li>`;
  }).join('');
  return `<details><summary>${vids.length}</summary><ul>${items}</ul></details>`;
}

function render() {
  for (const th of $('head').children) {
    th.querySelector('.arrow').textContent = th.dataset.key === sort.key ? (sort.desc ? '↓' : '↑') : '';
  }
  if (missing) {
    $('rows').innerHTML = `<tr><td class="empty" colspan="6">No content creators yet: <code>${esc(missing)}</code> isn't in the userData folder.</td></tr>`;
    $('count').textContent = '';
    return;
  }
  const get = sortValue[sort.key];
  const rows = creators.filter(keep).sort((a, b) => {
    const x = get(a), y = get(b);
    const d = x < y ? -1 : x > y ? 1 : 0;
    return (sort.desc ? -d : d) || (a.name || '').localeCompare(b.name || '');
  });
  $('count').textContent = `${rows.length} of ${creators.length} creators`;
  $('rows').innerHTML = rows.length ? rows.map((c) => `<tr>
    <td class="name">${esc(c.name)}</td>
    <td data-label="Instagram">${instagramCell(c.instagram)}</td>
    <td data-label="Twitch">${twitchCell(c.twitch)}</td>
    <td class="wide" data-label="EroScripts">${eroscriptsCell(c)}</td>
    <td class="wide" data-label="FapTap">${faptapCell(c)}</td>
    <td class="num" data-label="Score">${typeof c.score === 'number' ? c.score.toFixed(1) : '—'}</td>
  </tr>`).join('') : '<tr><td class="empty" colspan="6">No creators match.</td></tr>';
}

$('head').addEventListener('click', (e) => {
  const th = e.target.closest('th');
  if (!th) return;
  if (sort.key === th.dataset.key) sort.desc = !sort.desc;
  else sort = { key: th.dataset.key, desc: th.dataset.key !== 'name' };
  render();
});
$('dl-only').addEventListener('change', render);

(async () => {
  try {
    const r = await fetch('/api/creators', { cache: 'no-store' });
    const data = await r.json();
    if (r.status === 404 && data.missing) {
      missing = data.file || 'content-creators.json';
      $('meta').textContent = 'No data file yet.';
    } else if (!r.ok) {
      throw new Error(data.error || `HTTP ${r.status}`);
    } else {
      creators = data.creators || [];
      const at = data.updatedAt ? new Date(data.updatedAt) : null;
      $('meta').textContent = at && !isNaN(at) ? `Updated ${at.toLocaleString()}` : 'Update time unknown';
    }
  } catch (e) {
    $('meta').textContent = '';
    $('problems').hidden = false;
    $('problems').textContent = `Can't load the creators: ${e.message}`;
  }
  render();
})();
</script>
</body>
</html>
