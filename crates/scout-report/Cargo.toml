[package]
name = "scout-report"
version = "0.1.0"
description = "The swipe deck over the scouts' waiting posts and scenes, which stops swiping while the library drive is full"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "scout_report"
path = "src/lib.rs"

[[bin]]
name = "scout-report"
path = "src/main.rs"

[dependencies]
# The userData default (FUNSYNC_USER_DATA, else the app's folder) and the access PIN.
video-tags = { path = "../video-tags" }
# The running app's backend client (the Free space tab: video list, ratings).
age-screen = { path = "../age-screen" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The Duplicates tab's title words: the shared name rules (content-preferences.json `names`:
# an encode-token regex) and names folded like the JS side (NFKD, marks dropped, NFKC).
regex = { version = "1", default-features = false, features = ["std", "unicode-perl"] }
unicode-normalization = "0.1"
