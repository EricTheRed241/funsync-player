# FapTap scout: paused by the user (single-axis scripts), so created
# suspended. Resume with `npm run k8s -- resume faptap-scout`; decide the
# flags (scan only, or --fetch too) when it's resumed.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: faptap-scout
  labels: {app.kubernetes.io/part-of: funsync, funsync/job: faptap-scout}
spec:
  schedule: "30 0 * * *"
  timeZone: America/Toronto
  suspend: true
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 43200
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    metadata:
      labels: {app.kubernetes.io/part-of: funsync, funsync/job: faptap-scout}
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 21600
      ttlSecondsAfterFinished: 1209600
      template:
        metadata:
          labels: {app.kubernetes.io/part-of: funsync, funsync/job: faptap-scout}
        spec:
          restartPolicy: Never
          containers:
            - name: faptap-scout
              image: funsync-runner:current
              imagePullPolicy: Never
              args:
                - "node"
                - "scripts/faptap-scout.mjs"
              env:
                - name: TZ
                  value: "America/Toronto"
                - name: HOME
                  value: "/home/runner"
                - name: FUNSYNC_USER_DATA
                  value: "/Users/classicus-gvp/Library/Application Support/funsync-player"
                - name: FUNSYNC_BACKEND_URL
                  value: "http://funsync-app:5123"
                - name: FUNSYNC_REQUIRE_PATHS
                  value: "/Volumes/2TB-AGENTS/GVP:/Users/classicus-gvp/Library/Application Support/funsync-player"
              resources:
                requests: {cpu: 100m, memory: 128Mi}
                limits: {memory: 1Gi}
              volumeMounts:
                - name: library
                  mountPath: "/Volumes/2TB-AGENTS/GVP"
                - name: userdata
                  mountPath: "/Users/classicus-gvp/Library/Application Support/funsync-player"
                - name: home
                  mountPath: "/home/runner"
          volumes:
            - name: library
              hostPath: {path: "/Volumes/2TB-AGENTS/GVP", type: Directory}
            - name: userdata
              hostPath: {path: "/Users/classicus-gvp/Library/Application Support/funsync-player", type: Directory}
            - name: home
              emptyDir: {}
