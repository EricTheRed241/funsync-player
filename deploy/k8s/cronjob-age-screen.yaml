# Underage screener (PR #97), offered daily like the watchdog did:
# --weekly runs only when the last complete run is 7+ days old, otherwise
# it says "Not due" and exits 0. Needs the app running (ratings and the
# review playlist go through its backend). The judge is omp, with its own
# agent folder in the pod: config.yml (the judge's model) and the provider
# key come from the funsync-omp Secret (`npm run k8s -- secrets`, from
# ~/.config/funsync-k8s/omp/). Never the Mac's ~/.omp: its SQLite stores
# aren't safe to share across the VM's file sharing.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: age-screen
  labels: {app.kubernetes.io/part-of: funsync, funsync/job: age-screen}
spec:
  schedule: "0 12 * * *"
  timeZone: America/Toronto
  suspend: false
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 72000
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    metadata:
      labels: {app.kubernetes.io/part-of: funsync, funsync/job: age-screen}
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 14400
      ttlSecondsAfterFinished: 1209600
      template:
        metadata:
          labels: {app.kubernetes.io/part-of: funsync, funsync/job: age-screen}
        spec:
          restartPolicy: Never
          containers:
            - name: age-screen
              image: funsync-runner:current
              imagePullPolicy: Never
              args:
                - "sh"
                - "-c"
                - 'mkdir -p "$PI_CODING_AGENT_DIR" && if [ -f /secrets/omp/config.yml ]; then cp /secrets/omp/config.yml "$PI_CODING_AGENT_DIR/"; fi && exec age-screen --weekly'
              env:
                - name: TZ
                  value: "America/Toronto"
                - name: HOME
                  value: "/home/runner"
                - name: FUNSYNC_USER_DATA
                  value: "/Users/classicus-gvp/Library/Application Support/funsync-player"
                - name: FUNSYNC_BACKEND_URL
                  value: "http://funsync-app:5123"
                - name: FUNSYNC_REQUIRE_PATHS
                  value: "/Volumes/2TB-AGENTS/GVP:/Users/classicus-gvp/Library/Application Support/funsync-player"
                - name: PI_CODING_AGENT_DIR
                  value: "/home/runner/.omp/agent"
                - name: OPENROUTER_API_KEY
                  valueFrom: {secretKeyRef: {name: funsync-omp, key: OPENROUTER_API_KEY, optional: true}}
              resources:
                requests: {cpu: 100m, memory: 128Mi}
                limits: {memory: 2Gi}
              volumeMounts:
                - name: library
                  mountPath: "/Volumes/2TB-AGENTS/GVP"
                - name: userdata
                  mountPath: "/Users/classicus-gvp/Library/Application Support/funsync-player"
                - name: home
                  mountPath: "/home/runner"
                - name: secret-omp
                  mountPath: "/secrets/omp"
                  readOnly: true
          volumes:
            - name: library
              hostPath: {path: "/Volumes/2TB-AGENTS/GVP", type: Directory}
            - name: userdata
              hostPath: {path: "/Users/classicus-gvp/Library/Application Support/funsync-player", type: Directory}
            - name: home
              emptyDir: {}
            - name: secret-omp
              secret: {secretName: funsync-omp, optional: true}
